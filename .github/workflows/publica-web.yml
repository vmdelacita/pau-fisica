# Publica la web (carpeta web/) a GitHub Pages cada vegada que es puja un canvi a main.
# Abans de publicar regenera web/dades/ a partir de base_dades/.
# Cal activar-ho un sol cop a Settings > Pages > Source: "GitHub Actions".
name: Publica la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python eines/construeix_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: desplegament
        uses: actions/deploy-pages@v4
