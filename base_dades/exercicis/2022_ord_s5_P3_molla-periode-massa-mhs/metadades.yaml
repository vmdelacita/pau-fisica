id: 2022_ord_s5_P3_molla-periode-massa-mhs
titol: Constant elàstica d'una molla a partir del període d'oscil·lació
resum: >-
  A partir d'un gràfic experimental de T² en funció de la massa, càlcul de la constant
  elàstica de la molla i de la freqüència d'oscil·lació per a una massa donada; equació
  del moviment del MHS i punts d'extensió on la velocitat i l'acceleració són màximes.
