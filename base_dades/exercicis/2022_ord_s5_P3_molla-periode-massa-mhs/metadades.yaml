justificacio_dificultat: >-
  Cal interpretar un gràfic experimental (linealitzar T² en funció de m) per obtenir la
  constant elàstica, i després construir l'equació del MHS a partir de les condicions
  inicials i raonar sobre els punts de velocitat i acceleració màximes; és un problema
  PAU típic de diversos passos encadenats.
