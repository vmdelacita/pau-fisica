id: 2024_ext_s3_P7_molla-mhs-forca-elastica
titol: Massa penjada d'una molla en moviment harmònic simple
resum: >-
  Període, constant de la molla i equació del moviment d'una massa que oscil·la
  penjada d'una molla començant a la posició més baixa, amb la gràfica de la força
  elàstica; energia mecànica, energia cinètica en funció de la posició i velocitat.
