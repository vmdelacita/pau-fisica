  Deducció del radi de la trajectòria d'un ió en un camp magnètic en funció de m, v, e i
  B, i aplicació a la separació dels ions ¹²C⁻ i ¹⁴C⁻ en un espectròmetre de masses per
  a datar un fòssil.
