id: 2022_ext_s3_P6_efecte-fotoelectric-funcio-treball
titol: Efecte fotoelèctric i funció de treball
resum: >-
  Anàlisi qualitativa de com varien el nombre i l'energia dels electrons emesos per
  efecte fotoelèctric en augmentar la freqüència dels fotons a intensitat constant, i
  càlcul de la funció de treball a partir del potencial de frenada i la longitud d'ona
  incident.
