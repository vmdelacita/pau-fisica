id: 2018_ord_s5_P4B_electro-camp-electric-desviacio
titol: "Electró desviat per un camp elèctric uniforme"
resum: >-
  Comparació entre la força elèctrica i la força gravitatòria sobre un electró en un camp elèctric uniforme; desviació vertical de l'electró després de recórrer 1 cm en la direcció perpendicular al camp.
