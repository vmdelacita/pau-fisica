id: 2023_ord_s1_P7_lampada-uva-fotoelectric
titol: Tubs UVA d'una màquina de bronzejar i dispositiu fotoelèctric
resum: >-
  Energia cinètica màxima dels fotoelectrons emesos per una placa de sodi il·luminada amb
  llum UVA de 300 nm i intensitat del corrent; efecte de substituir el tub per un de 350 nm
  de la mateixa potència sobre el dispositiu de seguretat.
