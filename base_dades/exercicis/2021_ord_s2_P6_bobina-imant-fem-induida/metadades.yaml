paraules_clau: [inducció electromagnètica, llei de Faraday-Lenz, flux magnètic, força electromotriu, corrent induït, freqüència, gràfica de la FEM]
tipus: [càlcul, gràfic, qualitativa]
dificultat: 4
justificacio_dificultat: >-
  Requereix derivar el flux i la FEM en funció del temps amb paràmetres simbòlics i, a
  més, interpretar quatre gràfiques per identificar com canvien amplitud i període de la
  FEM en reduir la freqüència, cosa que exigeix relacionar dues magnituds simultàniament.
