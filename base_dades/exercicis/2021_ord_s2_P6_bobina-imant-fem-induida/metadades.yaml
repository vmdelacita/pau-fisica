id: 2021_ord_s2_P6_bobina-imant-fem-induida
titol: Imant oscil·lant dins una bobina
resum: >-
  Flux magnètic i força electromotriu induïda per un imant que oscil·la harmònicament
  entrant i sortint d'una bobina; corrent màxim en funció de la resistència i identificació
  de la gràfica de la FEM si es redueix la freqüència del moviment.
