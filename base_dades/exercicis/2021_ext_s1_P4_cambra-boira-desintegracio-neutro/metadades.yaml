id: 2021_ext_s1_P4_cambra-boira-desintegracio-neutro
titol: Desintegració beta del neutró en una cambra de boira
resum: >-
  A partir d'una fotografia d'una traça de cambra de boira, escriptura de la reacció
  de desintegració beta d'un neutró lliure identificant-ne les partícules, i càlcul de
  l'energia alliberada a partir del defecte de massa, expressada en keV.
