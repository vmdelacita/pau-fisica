notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat; segons la pauta cada apartat val 1 punt. A l'apartat b la pauta dona R = 2,30×10^-2 m, però amb les dades (1,67×10^-27 · 6,67×10^5)/(1,60×10^-19 · 3,00×10^-1) surt 2,32×10^-2 m; s'ha transcrit tal com és (DUBTE).
