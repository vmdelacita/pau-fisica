id: 2015_ext_s5_P5A_selector-velocitats-proto
titol: Selector de velocitats amb un protó
resum: >-
  Esquema dels camps i les forces sobre un protó en un selector de velocitats i velocitat per no desviar-se; radi de curvatura de la trajectòria quan s'interromp el camp elèctric.
font:
  tipus: examen
  any: 2015
  convocatoria: extraordinaria
  serie: 5
  exercici: 5
  opcio: A
  pdf_enunciat: examenes/pau_fisi15sl.pdf
  pagines_enunciat: [3]
  pdf_solucio: examenes/pau_fisi15sp.pdf
  pagines_solucio: [6]
format: antic
curriculum: actual
bloc: Camps electromagnètics
blocs_secundaris: []
subtemes:
  - selector de velocitats, espectròmetre i ciclotró
  - moviment de càrregues en camps magnètics
paraules_clau: [selector de velocitats, protó, camps creuats, força de Lorentz, gauss, radi de curvatura, trajectòria circular]
tipus: [càlcul, diagrama]
dificultat: 2
justificacio_dificultat: >-
  Dos passos estàndard i guiats: igualar força elèctrica i magnètica per obtenir v = E/B i aplicar R = mv/(qB), amb el canvi d'unitats de gauss a tesla.
