notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat;
  segons la pauta cada apartat val 1 punt. A l'original la figura és a la dreta del text
  introductori. L'enunciat anomena «ànode» l'elèctrode A il·luminat que emet electrons i
  «càtode» el B, al revés del que és habitual; es manté tal com és. Els punts decimals de
  la pauta (1.602, 2.3, 5.3, 4.7) s'han passat a coma.
