id: 2014_ext_s5_P3B_tub-buit-fotoelectric-coure
titol: Tub de buit amb efecte fotoelèctric en un elèctrode de coure
resum: >-
  Fotons de 10 eV arrenquen electrons d'un elèctrode de coure en un tub de buit amb un
  camp elèctric uniforme (3 V en 30 cm); els electrons arriben a l'altre elèctrode amb
  2,3 eV. Freqüència i longitud d'ona de la radiació, camp elèctric, energia cinètica
  d'emissió per conservació de l'energia i treball d'extracció del coure.
