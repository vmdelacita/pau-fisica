  - moviment de càrregues en camps elèctrics
paraules_clau: [tub de buit, efecte fotoelèctric, coure, treball d'extracció, camp elèctric uniforme, diferència de potencial, conservació de l'energia, electronvolt]
tipus: [càlcul]
dificultat: 4
justificacio_dificultat: >-
  Combina l'efecte fotoelèctric amb el moviment d'electrons en un camp elèctric: cal
  aplicar la conservació de l'energia amb el signe correcte de la diferència de
  potencial per obtenir l'energia cinètica d'emissió abans del treball d'extracció.
