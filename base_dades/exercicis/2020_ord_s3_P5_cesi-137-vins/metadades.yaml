id: 2020_ord_s3_P5_cesi-137-vins
titol: Datació de vins amb cesi 137
resum: >-
  A partir de la gràfica de l'activitat de Cs-137 en vins de diferents anyades, càlcul del
  període de semidesintegració i dibuix de la corba de decaïment dels vins del 1972;
  compleció d'una reacció de fissió de l'urani 235 que produeix Cs-137.
