  - reaccions nuclears i defecte de massa
  - fissió i fusió
  - aplicacions i riscos de la radioactivitat
paraules_clau: [cesi 137, datació, vins, activitat, període de semidesintegració, corba de decaïment, fissió de l'urani, guerra freda, Txernòbil]
