id: 2014_ord_s4_P5B_violi-corda-ones-estacionaries
titol: Ones estacionàries en la corda d'un violí
resum: >-
  Corda de violí de 32 cm amb freqüència fonamental de 196 Hz: longitud d'ona del mode
  fonamental, posició de nodes i ventres i velocitat de propagació; perfil del tercer i
  del cinquè modes de vibració i les seves freqüències.
font:
  tipus: examen
  any: 2014
  convocatoria: ordinaria
  serie: 4
  exercici: 5
  opcio: B
  pdf_enunciat: examenes/pau_fisi14jl.pdf
  pagines_enunciat: [8]
  pdf_solucio: examenes/pau_fisi14jp.pdf
  pagines_solucio: [9]
format: antic
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - ones estacionàries
  - ressonància i harmònics en tubs i cordes
paraules_clau: [violí, corda, ona estacionària, mode fonamental, harmònics, nodes i ventres, velocitat de propagació]
tipus: [càlcul, qualitativa, diagrama]
dificultat: 2
justificacio_dificultat: >-
  Aplicació directa de la condició d'ona estacionària en una corda fixa pels dos
  extrems i dibuix esquemàtic dels harmònics.
punts_total: 2
apartats:
  - etiqueta: "a"
