    descripcio: Perfil del tercer harmònic d'una corda fixa pels extrems (tres ventres)
  - fitxer: sol_fig2.png
    on: solucio
    descripcio: Perfil del cinquè harmònic d'una corda fixa pels extrems (cinc ventres)
solucio_oficial: true
