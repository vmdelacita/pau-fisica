notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat; segons la pauta cada apartat val 1 punt. A la pauta les puntuacions parcials són en caixes amb punt decimal (0.2) i s'han passat a coma. A l'original la fotografia és a la dreta del text. A la pauta diu «El node
  fonamental» (errata per «mode»); es transcriu tal com és amb % DUBTE. Les puntuacions
  de 0,3 p dels dibuixos són a la dreta, al peu de cada figura. Mateixes dades (32 cm,
  196 Hz) que 2021_ext_s1_P3_corda-violi-harmonics, però amb preguntes diferents.
