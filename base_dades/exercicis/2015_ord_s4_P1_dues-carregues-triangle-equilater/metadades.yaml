id: 2015_ord_s4_P1_dues-carregues-triangle-equilater
titol: Camp i potencial de dues càrregues oposades en el vèrtex d'un triangle equilàter
resum: >-
  Representació i càlcul del camp elèctric i del potencial creats per dues càrregues de 0,03 μC de signe contrari separades 40 cm en el tercer vèrtex del triangle equilàter; variació de l'energia potencial elèctrica del sistema en duplicar la distància entre les càrregues.
