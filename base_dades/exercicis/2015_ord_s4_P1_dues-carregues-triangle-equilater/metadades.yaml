notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat; segons la pauta cada apartat val 1 punt. A la pauta, E_P = 1687 N/C (el càlcul dona 1686 N/C) i U_i = -2,03·10^-5 J (el càlcul dona -2,02·10^-5 J); es transcriu tal com és amb % DUBTE. A l'original la figura de la pauta és a la dreta del text de l'apartat a.
