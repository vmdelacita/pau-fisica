id: 2013_ext_s1_P5A_fotoelectric-potassi-potencial-frenada
titol: Efecte fotoelèctric amb un elèctrode de potassi i un material desconegut
resum: >-
  Velocitat dels electrons arrancats d'un elèctrode de potassi il·luminat amb llum violada
  de 400 nm; treball d'extracció d'un material desconegut a partir del potencial de frenada
  i identificació de l'element amb una taula de valors.
