id: 2026_ord_s1_E4B_efecte-fotoelectric-llum-colors
titol: Efecte fotoelèctric amb llum blava, verda i vermella
resum: >-
  A partir del potencial de frenada amb llum blava de 460 nm, càlcul de la funció de treball del
  càtode i de la velocitat màxima dels fotoelectrons; potencial de frenada amb llum verda (520 nm)
  i justificació que la llum vermella (650 nm) no produeix efecte fotoelèctric.
