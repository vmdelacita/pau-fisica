id: 2017_ord_s5_P3A_microscopi-fotons-electrons
titol: Poder de resolució dels microscopis òptic i electrònic
resum: >-
  Energia i quantitat de moviment d'un fotó de 400 nm d'un microscopi òptic; longitud
  d'ona de De Broglie d'electrons amb una quantitat de moviment donada i comparació del
  poder de resolució dels microscopis electrònic i òptic.
