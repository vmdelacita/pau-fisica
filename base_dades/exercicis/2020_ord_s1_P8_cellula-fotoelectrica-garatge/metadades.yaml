id: 2020_ord_s1_P8_cellula-fotoelectrica-garatge
titol: Cèl·lula fotoelèctrica de la porta del garatge
resum: >-
  Freqüència i energia (en J i eV) de fotons de tres longituds d'ona que incideixen sobre
  un material alcalí amb funció de treball d'1,20 eV; gràfica de l'energia cinètica màxima
  dels electrons en funció de l'energia dels fotons i justificació de quins arrenquen electrons.
