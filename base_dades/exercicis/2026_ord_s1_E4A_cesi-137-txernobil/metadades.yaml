id: 2026_ord_s1_E4A_cesi-137-txernobil
titol: Cesi-137 de l'accident de Txernòbil
resum: >-
  Reacció de desintegració beta menys del cesi-137 i percentatge que en queda 40 anys després de
  l'accident de Txernòbil; any en què una zona contaminada tornarà a ser habitable segons la
  llei de desintegració.
