notes: >-
  La pauta anomena aquesta opció "opció 1". L'enunciat diu "vida mitjana (30,17 anys)", però
  30,17 anys és en realitat el període de semidesintegració del Cs-137; la pauta accepta les dues
  interpretacions a l'apartat 4.1, però a l'apartat 4.2 només calcula amb λ = 7,28e-10 s^-1
  (semidesintegració), que dona 121 anys (any 2107). Amb la vida mitjana sortirien ~84 anys.
  Es transcriu tal com és.
