id: 2025_ext_s3_E2B_model-bohr-hidrogen
titol: Model de Bohr de l'àtom d'hidrogen
resum: >-
  Demostració de L = e·√(k·m·r) per a l'electró en òrbita circular sota la força de
  Coulomb, deducció i càlcul del radi de Bohr amb la quantització del moment angular, i
  càlcul de les energies cinètica, potencial i mecànica clàssiques de l'electró.
