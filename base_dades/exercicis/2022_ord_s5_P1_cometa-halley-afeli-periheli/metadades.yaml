id: 2022_ord_s5_P1_cometa-halley-afeli-periheli
titol: El cometa Halley, la seva òrbita i el camp gravitatori del Sol
resum: >-
  A partir del període orbital del cometa Halley, càlcul del semieix major de la seva
  òrbita el·líptica (tercera llei de Kepler) i esquema de l'òrbita; intensitat de camp
  gravitatori del Sol a l'afeli i al periheli coneixent la distància del periheli.
