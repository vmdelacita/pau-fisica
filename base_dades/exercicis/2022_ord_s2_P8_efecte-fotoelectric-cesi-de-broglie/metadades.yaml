justificacio_dificultat: >-
  Diversos càlculs encadenats (freqüència llindar, comparació amb tres làsers, energia
  cinètica, representació gràfica) i, en el segon apartat, combinació de l'equació de
  l'efecte fotoelèctric amb l'energia cinètica clàssica i la longitud d'ona de De Broglie;
  típic problema PAU de diversos passos.
