id: 2022_ord_s2_P8_efecte-fotoelectric-cesi-de-broglie
titol: Efecte fotoelèctric en el cesi amb diferents punters làser
resum: >-
  Càlcul del treball d'extracció del cesi, determinació de quins punters làser produeixen
  efecte fotoelèctric, taula i gràfic de l'energia cinètica dels electrons en funció de la
  freqüència; càlcul de la velocitat i la longitud d'ona de De Broglie dels electrons
  arrencats amb un làser concret.
