titol: Tub d'orgue obert de la Sagrada Família
resum: >-
  Freqüències i longituds d'ona de les ones estacionàries en un tub d'orgue obert pels dos
  extrems d'1,0 m de longitud ple d'aire, i freqüències si el tub estigués ple d'heli.
