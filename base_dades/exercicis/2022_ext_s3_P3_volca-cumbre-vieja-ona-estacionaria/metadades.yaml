id: 2022_ext_s3_P3_volca-cumbre-vieja-ona-estacionaria
titol: El volcà Cumbre Vieja com a tub d'ona estacionària
resum: >-
  Càlcul de la longitud d'ona i de la longitud d'un tub tancat-obert (xemeneia volcànica)
  a partir de la freqüència fonamental d'una ona estacionària, i càlcul del nivell
  d'intensitat sonora a una altra distància del volcà.
