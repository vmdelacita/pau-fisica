tipus: [càlcul, diagrama]
dificultat: 3
justificacio_dificultat: >-
  Cal relacionar la freqüència fonamental amb la longitud d'un tub tancat per un extrem
  (un quart de longitud d'ona) i, a l'altre apartat, combinar la definició de nivell
  d'intensitat sonora amb l'atenuació geomètrica (llei de l'invers del quadrat).
