id: 2020_ord_s3_P8_hidrogen-muonic-bohr
titol: Hidrogen muònic segons el model de Bohr
resum: >-
  A partir de la condició de quantització de Bohr i la llei de Coulomb, radi de l'òrbita
  fonamental del muó en l'hidrogen muònic i comparació de mida amb l'hidrogen; freqüència i
  longitud d'ona del fotó emès en la transició n = 2 → n = 1.
