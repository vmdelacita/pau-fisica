id: 2013_ext_s1_P3B_iode-131-gammagrafia
titol: Iode 131 com a radiofàrmac per a gammagrafies
resum: >-
  Fracció de iode 131 (període de semidesintegració de 13,2 h) que resta al cos 24 hores
  després d'injectar-lo; esquema del procés nuclear en què el iode 131 produeix xenó 131 i
  identificació de la partícula emesa.
