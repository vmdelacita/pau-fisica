  Equació de la desintegració alfa del Po-210 i activitat de 5 mg al cap d'una setmana
  a partir del temps de semidesintegració; treball del camp elèctric en portar dos
  electrons fins a la partícula alfa i energia potencial electrostàtica de la
  configuració final.
