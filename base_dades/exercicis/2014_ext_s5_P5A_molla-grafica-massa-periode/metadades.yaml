id: 2014_ext_s5_P5A_molla-grafica-massa-periode
titol: Constant elàstica d'una molla a partir de la gràfica massa–període al quadrat
resum: >-
  Càlcul de la constant elàstica d'una molla a partir de la gràfica de la massa penjada
  en funció del quadrat del període i energia cinètica màxima per a una amplitud de
  0,10 m; acceleració màxima d'una massa d'1,5 kg que oscil·la amb amplitud 0,20 m i
  treball de la força de fregament que atura l'oscil·lació dins l'aigua.
