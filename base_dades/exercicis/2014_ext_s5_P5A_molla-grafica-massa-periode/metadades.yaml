tipus: [càlcul, gràfic, experimental]
dificultat: 2
justificacio_dificultat: >-
  Lectura d'un punt de la gràfica i aplicació directa de T = 2π√(m/k), de l'energia del
  MHS i de l'acceleració màxima; el treball del fregament és igual a l'energia inicial.
