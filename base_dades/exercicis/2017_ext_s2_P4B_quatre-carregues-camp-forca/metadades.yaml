    descripcio: Rectangle amb les càrregues de 3,0 μC i Q, la distància l i els vectors E_x i F_x a l'origen
solucio_oficial: true
revisat: false
notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació dels apartats;
  s'ha pres la de la pauta (1 + 1). A la pauta la figura és a la dreta de l'apartat a,
  i una de les puntuacions de l'apartat a («(0.2 p)») va entre parèntesis dins del
  text. A l'apartat b la pauta diu «la càrrega Q (protó) és positiva», que es
  transcriu tal com és.
