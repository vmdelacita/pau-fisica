id: 2016_ord_s3_P5B_espira-camp-magnetic-centre
titol: Camp magnètic al centre d'una espira circular
resum: >-
  Mòdul del camp magnètic al centre d'una espira circular de 5 cm de radi amb un corrent
  de 10 A a partir de l'expressió donada del camp a l'eix; sentit del corrent perquè el
  camp al centre tingui el sentit positiu de l'eix x.
