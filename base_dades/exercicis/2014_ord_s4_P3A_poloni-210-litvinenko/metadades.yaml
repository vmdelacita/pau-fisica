id: 2014_ord_s4_P3A_poloni-210-litvinenko
titol: Enverinament de Litvinenko amb poloni 210
resum: >-
  Reacció de desintegració alfa del poloni 210 que dona un isòtop del plom; massa de
  poloni que quedava a l'organisme vint dies després d'una dosi de 5 mg, amb un període
  de semidesintegració efectiu de 37 dies.
