notes: >-
  Enunciat i pauta escanejats, transcrits visualment. Errates de la pauta mantingudes:
  k en «rad/s» (hauria de ser rad/m), «En el vuit» (buit) i «λ = cf» (hauria de ser
  λ = c/f; el valor numèric 7,85e-7 m sí que és correcte).
