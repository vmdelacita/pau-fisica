id: 2020_ord_s3_P4_accelerador-lineal-cilindres
titol: Accelerador lineal de cilindres per a electrons
resum: >-
  Signes de les càrregues dels cilindres d'un accelerador lineal per accelerar un electró,
  línies de camp entre cilindres i separació per obtenir un camp donat; nombre d'espais
  necessaris per arribar a 1,0 MeV i velocitat clàssica resultant (superior a c).
font:
  tipus: examen
  any: 2020
  convocatoria: ordinaria
  serie: 3
  exercici: 4
  opcio: null
  pdf_enunciat: examenes/pau_fisi20jl.pdf
  pagines_enunciat: [6]
  pdf_solucio: examenes/pau_fisi20jp.pdf
  pagines_solucio: [11, 12]
format: antic
curriculum: actual
bloc: Camps electromagnètics
blocs_secundaris: ["Física relativista, quàntica i nuclear"]
subtemes:
  - moviment de càrregues en camps elèctrics
  - potencial i energia potencial elèctrica
  - línies de camp i superfícies equipotencials
  - relativitat especial
paraules_clau: [accelerador lineal, electró, camp elèctric uniforme, diferència de potencial, línies de camp, electronvolt, velocitat superior a c, correcció relativista]
tipus: [càlcul, diagrama, qualitativa]
dificultat: 3
