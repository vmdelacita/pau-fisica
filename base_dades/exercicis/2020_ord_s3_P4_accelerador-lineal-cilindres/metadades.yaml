    descripcio: Esquema d'un accelerador lineal amb cilindres connectats alternativament a una font alterna i espais A, B, C, D
  - fitxer: sol_fig1.png
    on: solucio
    descripcio: Línies de camp elèctric entre un cilindre negatiu i un de positiu, amb la força sobre l'electró i la distància d
