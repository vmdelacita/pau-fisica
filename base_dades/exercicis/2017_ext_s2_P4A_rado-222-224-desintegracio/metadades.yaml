notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació dels apartats;
  s'ha pres la de la pauta (1 + 1). Errades de la pauta transcrites tal com són (vegeu
  els % DUBTE): els subíndexs de les constants de desintegració diuen «Ra» en lloc de
  «Rn», i a l'equació ln(9,00·10⁻²/1,00·10⁻¹) = 7,56·10⁻³ t hi falta el signe menys
  (el resultat t = 13,9 h és correcte). La partícula β s'escriu a la pauta amb
  superíndex «−1» (β^{-1}) i l'antineutrí amb subíndex «e−»; es mantenen així. Els
  símbols dels nuclis són en cursiva a la pauta i es mantenen; les unitats s'han posat
  en rodona.
