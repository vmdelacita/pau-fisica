id: 2017_ext_s2_P4A_rado-222-224-desintegracio
titol: Desintegració de dues mostres de radó 222 i radó 224
resum: >-
  Equacions de la desintegració α del ²²²Rn i β⁻ del ²²⁴Rn; àtoms de ²²⁴Rn que queden
  quan la mostra de ²²²Rn s'ha reduït a 9,00·10⁻² mol; defecte de massa a partir de
  l'energia alliberada (5,590 MeV) en cada desintegració del ²²²Rn.
