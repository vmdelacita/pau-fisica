id: 2026_ord_s1_E1B_cometa-halley-kepler
titol: Òrbita el·líptica del cometa Halley
resum: >-
  Dibuix de l'òrbita el·líptica del cometa Halley, càlcul del semieix major i del període
  amb la tercera llei de Kepler i raonament històric sobre les observacions de Halley;
  punt de velocitat màxima i velocitat al periheli per conservació del moment angular o de l'energia.
font:
  tipus: examen
  any: 2026
  convocatoria: ordinaria
  serie: 1
  exercici: 1
  opcio: B
  pdf_enunciat: examenes/pau_fisi26jl.pdf
  pagines_enunciat: [2]
  pdf_solucio: examenes/pau_fisi26jp.pdf
  pagines_solucio: [3, 4]
format: nou
curriculum: actual
bloc: Camps gravitatoris
blocs_secundaris: []
subtemes:
  - lleis de Kepler
  - òrbites el·líptiques i moment angular
  - energia mecànica orbital
paraules_clau: [cometa Halley, periheli, afeli, semieix major, tercera llei de Kepler, segona llei de Kepler, conservació del moment angular, conservació de l'energia, unitat astronòmica]
tipus: [diagrama, càlcul, qualitativa]
dificultat: 3
justificacio_dificultat: >-
  Problema PAU típic d'òrbita el·líptica: cal aplicar la tercera llei de Kepler amb unitats
  astronòmiques, raonar amb context històric i triar un principi de conservació per a la velocitat al periheli.
