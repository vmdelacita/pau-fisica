solucio_oficial: true
revisat: false
notes: >-
  La pauta anomena aquesta opció "opció 2". A la solució alternativa per energies de l'apartat
  1.2, la substitució numèrica de la pauta posa (1/35,3 - 1/0,575), en ordre invers de
  l'expressió simbòlica (1/r_P - 1/r_A); es transcriu tal com és (el resultat 5,5e4 m/s és
  el de l'ordre correcte). "L'Edmon Halley" es transcriu tal com és a la pauta.
