id: 2020_ext_s4_P3_teranyina-aranya-mhs
titol: Vibració d'una teranyina amb una aranya i un insecte
resum: >-
  La teranyina es modelitza com una molla: a partir de la freqüència de vibració amb
  l'aranya sola i amb un insecte atrapat, càlcul de la massa de l'aranya i de la constant
  elàstica; posicions de velocitat màxima i d'acceleració màxima del MHS.
