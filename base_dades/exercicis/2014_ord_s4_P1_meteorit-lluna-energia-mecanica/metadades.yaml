dificultat: 3
justificacio_dificultat: >-
  Cal aplicar la conservació de l'energia mecànica amb l'energia potencial gravitatòria
  (no la mgh) i conèixer l'expressió de l'energia mecànica d'una òrbita circular per
  comparar-la amb la d'un cos no lligat.
