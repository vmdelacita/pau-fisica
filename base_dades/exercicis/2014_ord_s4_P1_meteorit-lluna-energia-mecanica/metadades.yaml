id: 2014_ord_s4_P1_meteorit-lluna-energia-mecanica
titol: Meteorit que cau sobre la Lluna
resum: >-
  Velocitat amb què arriba a la superfície lunar un meteorit de 400 kg que cau
  radialment i que a 10 000 km de la superfície va a 15 000 km/h, per conservació de
  l'energia; energia mecànica del meteorit a aquesta altura i comparació amb la d'un cos
  de la mateixa massa en òrbita circular a la mateixa altura.
