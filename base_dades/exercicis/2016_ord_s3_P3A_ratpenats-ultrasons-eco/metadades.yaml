id: 2016_ord_s3_P3A_ratpenats-ultrasons-eco
titol: Ecolocalització dels ratpenats amb ultrasons
resum: >-
  Longitud d'ona i període dels ultrasons d'un ratpenat i diferència de fase de l'eco
  d'un mosquit entre les dues orelles; quocient d'intensitats dels ecos a les dues orelles
  i diferència de nivells d'intensitat sonora en decibels.
