id: 2025_mostra_experiments_Q5_capsula-petri-equipotencials
titol: Superfícies equipotencials en una càpsula de Petri
resum: >-
  Dues plaques paral·leles a 12,0 V separades 6,00 cm dins d'aigua destil·lada: camp elèctric
  uniforme, dibuix de les superfícies equipotencials amb el seu potencial i treball per
  desplaçar una càrrega de 0,1 µC des d'un punt a 7,0 V fins a la placa positiva.
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: experiments
  exercici: 5
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_QuestionsExperiments.pdf
  pagines_enunciat: [7]
  pdf_solucio: examenes/pau_fisi17jp.pdf
  pagines_solucio: [8]
format: nou
curriculum: actual
bloc: Camps electromagnètics
blocs_secundaris: []
subtemes:
  - línies de camp i superfícies equipotencials
  - potencial i energia potencial elèctrica
paraules_clau: [càpsula de Petri, plaques paral·leles, camp elèctric uniforme, superfícies equipotencials, voltímetre, sonda, treball elèctric]
tipus: [experimental, càlcul, diagrama]
dificultat: 2
justificacio_dificultat: >-
  Aplicació directa de E = ΔV/d i W = qΔV en un muntatge experimental senzill, amb un
  dibuix qualitatiu de les equipotencials.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Camp elèctric entre les plaques (mòdul, direcció, sentit) i dibuix de les equipotencials amb el seu potencial.
  - etiqueta: "b"
    punts: 1.25
    resum: Treball d'una força externa per portar 0,1 µC d'un punt a 7,0 V fins a la placa positiva.
figures:
  - fitxer: fig1.png
    on: enunciat
    descripcio: Càpsula de Petri amb dues plaques paral·leles a 0 V i 12 V i una sonda connectada al voltímetre
  - fitxer: sol_fig1.png
    on: solucio
    descripcio: Plaques a 0 V i 12 V amb les superfícies equipotencials de 3 V, 6 V i 9 V i les línies de camp dirigides cap a l'esquerra
solucio_oficial: true
revisat: false
notes: >-
  És el problema P4 de l'opció B de la PAU de Física de juny de 2017 (sèrie 1,
  examenes/pau_fisi17jl.pdf, pàgina 4). La pauta és l'oficial d'aquella convocatòria
  (examenes/pau_fisi17jp.pdf, pàgina 8) i no s'ha duplicat a la base de dades: a la
  convocatòria 2017_ord_s1 aquest exercici ocupa la posició del P4B. El document
  "Qüestions d'interpretació i anàlisi d'experiments" el reprodueix com a segon exemple
  (apartat Reconeixement de línies de camp elèctric i superfícies equipotencials) i
  l'identifica com a "PAU 2017 JUNY OPCIÓ B P4"; el text coincideix amb el de 2017. A
  2017 valia 2 punts (1 + 1); com que és una pregunta de format nou, es manté a 2,5 punts
  (1,25 + 1,25) i les puntuacions parcials de la pauta oficial s'han reescalat ×1,25
  (0,5/0,2/0,3 → 0,625/0,25/0,375 i 0,2/0,6/0,2 → 0,25/0,75/0,25). A la pauta, la figura
  de la solució està retallada pel marge dret a l'original.
