id: 2016_ord_s5_P5A_cellula-fotoelectrica-llum-verda
titol: Cèl·lula fotoelèctrica il·luminada amb llum verda
resum: >-
  Treball d'extracció i freqüència llindar del càtode d'una cèl·lula fotoelèctrica a partir
  de la longitud d'ona de la llum i del potencial de frenada; raonament de si hi ha efecte
  fotoelèctric per a longituds d'ona o freqüències per sobre del llindar.
