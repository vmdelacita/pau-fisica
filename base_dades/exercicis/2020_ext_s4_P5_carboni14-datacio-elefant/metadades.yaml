titol: Datació per carboni 14 d'ossos d'elefant
resum: >-
  Reacció nuclear de formació del carboni 14 a partir del nitrogen 14 per captura d'un
  neutró i justificació, amb el defecte de massa, de si allibera o absorbeix energia;
  edat d'una mostra òssia que conté un 23 % menys de carboni 14 que una de recent.
