id: 2016_ext_s1_P5A_fluor18-tep-positro
titol: Fluor 18 en la tomografia per emissió de positrons
resum: >-
  Protons i neutrons del fluor 18, coeficients de l'equació de la desintegració β⁺,
  freqüència dels fotons gamma produïts en l'anihilació positró-electró i temps perquè
  quedi l'1 % dels nuclis inicials (període de 109,77 min).
