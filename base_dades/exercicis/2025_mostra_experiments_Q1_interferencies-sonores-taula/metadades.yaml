id: 2025_mostra_experiments_Q1_interferencies-sonores-taula
titol: Interferències sonores amb dos altaveus (taula de dades)
resum: >-
  A partir d'una taula de distàncies de punts d'interferència constructiva a dos altaveus
  separats 4 m, calcular |R1-R2|, identificar l'ordre n i estimar la longitud d'ona i la
  freqüència; nombre de punts nodals entre els altaveus i per què no hi ha interferències
  amb un equip estèreo.
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: experiments
  exercici: 1
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_QuestionsExperiments.pdf
  pagines_enunciat: [3, 4]
  pdf_solucio: documents oficials/02_pau25_fisica_QuestionsExperiments.pdf
  pagines_solucio: []
format: nou
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - interferències
  - ones sonores i nivell d'intensitat
paraules_clau: [interferències sonores, altaveus, fonts coherents, diferència de camins, interferència constructiva, punts nodals, longitud d'ona, freqüència, dades experimentals]
tipus: [experimental, càlcul, qualitativa]
dificultat: 4
justificacio_dificultat: >-
  Cal tractar dades experimentals reals (amb error) per deduir l'ordre de cada línia
  d'interferència i estimar la longitud d'ona, i raonar sobre coherència i punts nodals.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Completar la taula (|R1-R2| i n) i estimar la longitud d'ona i la freqüència.
  - etiqueta: "b"
    punts: 1.25
    resum: Nombre de punts nodals entre els altaveus i absència d'interferències en un equip estèreo.
figures:
  - fitxer: fig1.png
    on: enunciat
    descripcio: Dos altaveus separats 4 m i un punt a distàncies R1 i R2 de cadascun
solucio_oficial: false
revisat: false
notes: >-
  Exemple de pregunta del document "Qüestions d'interpretació i anàlisi d'experiments"
  (apartat Interferències sonores). El document no dona puntuació ni solució: s'han repartit
  2,5 punts a parts iguals (1,25 + 1,25). La taula apareix al final de l'enunciat, després
  de l'apartat b, com a l'original.
