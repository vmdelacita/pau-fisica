id: 2013_ord_s3_P3A_fotoelectric-plom-constant-planck
titol: Efecte fotoelèctric en una placa de plom i constant de Planck
resum: >-
  A partir dels potencials de frenada (4,01 V i 8,15 V) per a dues longituds d'ona ultraviolades, velocitat màxima dels fotoelectrons, funció de treball del plom i determinació de la constant de Planck.
