id: 2025_mostra_experiments_Q2_interferencies-sonores-punts
titol: Interferències sonores en punts d'un pla (170 Hz)
resum: >-
  Dos altaveus coherents a (-3,0) i (3,0) emeten a 170 Hz: longitud d'ona i decidir en quins
  punts representats hi ha màxims i mínims d'intensitat; per què cal tapar-se una orella i
  efecte d'un retard temporal entre els senyals al punt (0,2).
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: experiments
  exercici: 2
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_QuestionsExperiments.pdf
  pagines_enunciat: [4]
  pdf_solucio: documents oficials/02_pau25_fisica_QuestionsExperiments.pdf
  pagines_solucio: []
format: nou
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - interferències
  - ones sonores i nivell d'intensitat
paraules_clau: [interferències sonores, altaveus, fonts coherents, diferència de camins, màxims i mínims, desfasament, longitud d'ona]
tipus: [experimental, càlcul, qualitativa]
dificultat: 3
justificacio_dificultat: >-
  Cal calcular distàncies en un pla per a cada punt i aplicar les condicions d'interferència;
  l'apartat b demana raonament qualitatiu sobre el muntatge i el desfasament.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Longitud d'ona i punts de la figura amb intensitat màxima o mínima.
  - etiqueta: "b"
    punts: 1.25
    resum: Per què tapar-se una orella i efecte d'un retard temporal entre altaveus al punt (0,2).
figures:
  - fitxer: fig1.png
    on: enunciat
    descripcio: Pla x-y (m) amb els altaveus a (-3,0) i (3,0) i els punts (-3;4,5), (0,3), (0,2) i (3;2,5)
solucio_oficial: false
revisat: false
notes: >-
  Segon exemple de pregunta del document "Qüestions d'interpretació i anàlisi d'experiments"
  (apartat Interferències sonores). El document no dona puntuació ni solució: s'han repartit
  2,5 punts a parts iguals (1,25 + 1,25). Errades de l'original transcrites tal com són
  ("esta situa", "Justifica al resposta", "Que passarà").
