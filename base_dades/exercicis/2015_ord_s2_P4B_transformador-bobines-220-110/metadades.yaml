id: 2015_ord_s2_P4B_transformador-bobines-220-110
titol: Transformador reductor de 220 V a 110 V amb bobines
resum: >-
  Disseny raonat d'un transformador amb bobines de 1 000 i 500 espires per passar d'una
  tensió eficaç de 220 V a 110 V, indicant el primari i el secundari; valors màxims de la
  tensió i la intensitat al primari i intensitat al secundari.
font:
  tipus: examen
  any: 2015
  convocatoria: ordinaria
  serie: 2
  exercici: 4
  opcio: B
  pdf_enunciat: examenes/pau_fisi15jl.pdf
  pagines_enunciat: [3]
  pdf_solucio: examenes/pau_fisi15jp.pdf
  pagines_solucio: [8]
format: antic
curriculum: actual
bloc: Camps electromagnètics
blocs_secundaris: []
subtemes:
  - generadors, motors i transformadors
  - flux magnètic i inducció (Faraday-Lenz)
paraules_clau: [transformador, bobines, espires, primari, secundari, tensió eficaç, valor màxim, corrent altern, potència]
tipus: [qualitativa, càlcul, diagrama]
dificultat: 2
justificacio_dificultat: >-
  Aplicació directa de la relació de transformació i de la conservació de la potència en un
  transformador ideal, més la relació entre valors eficaços i màxims.
punts_total: 2
apartats:
  - etiqueta: "a"
    punts: 1
    resum: Esquema i explicació del muntatge del transformador indicant el primari i el secundari.
  - etiqueta: "b"
    punts: 1
    resum: Valors màxims de la tensió i la intensitat al primari i intensitat al circuit de 110 V.
