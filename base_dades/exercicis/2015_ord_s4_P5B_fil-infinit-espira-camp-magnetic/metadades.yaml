id: 2015_ord_s4_P5B_fil-infinit-espira-camp-magnetic
titol: Camp magnètic d'un fil infinit i d'una espira al centre de l'espira
resum: >-
  Vectors del camp magnètic creat al centre d'una espira circular pel fil infinit proper (2 A a 5 cm) i per la mateixa espira (500 mA, 2 cm de diàmetre); camp total i intensitat que ha de circular per l'espira perquè el camp total sigui nul.
