notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat; segons la pauta cada apartat val 1 punt. A l'original la figura de l'enunciat és a la dreta del text. A la pauta, la figura amb els eixos és al final de la pàgina 17, abans del títol del P5. A l'apartat b la pauta escriu B_total = B_espira − B_fil∞ en notació vectorial restant els mòduls (com a suma vectorial hauria de ser +, amb B_fil∞ negatiu); es transcriu tal com és amb % DUBTE.
