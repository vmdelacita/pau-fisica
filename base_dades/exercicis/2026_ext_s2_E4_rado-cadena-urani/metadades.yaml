id: 2026_ext_s2_E4_rado-cadena-urani
titol: El radó i la cadena de desintegració de l'urani
resum: >-
  A partir d'un esquema de la cadena de desintegració de l'urani-238 fins al radó-222, cal
  escriure les desintegracions alfa i beta; després, activitat d'una massa de radó en una
  habitació, comparació amb el llindar de 300 Bq/m³ i activitat per unitat de volum al cap
  de 15 dies.
