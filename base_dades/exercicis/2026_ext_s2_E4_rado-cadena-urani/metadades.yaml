justificacio_dificultat: >-
  Cal llegir un esquema de cadena radioactiva i escriure sis reaccions identificant-ne el
  tipus, i encadenar massa → nombre d'àtoms → activitat → activitat per volum i llei de
  desintegració; molts passos però estàndard.
