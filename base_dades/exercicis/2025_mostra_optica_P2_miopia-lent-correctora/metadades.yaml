id: 2025_mostra_optica_P2_miopia-lent-correctora
titol: Correcció de la miopia amb una lent divergent
resum: >-
  Tipus de lent, focal i potència per corregir un ull miop que només enfoca fins a 4 m;
  posició de la imatge d'un arbre a 12 m creada per la lent correctora i diagrama de
  rajos a escala en una quadrícula.
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: optica
  exercici: 2
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_MostraExercicis_optica.pdf
  pagines_enunciat: [1]
  pdf_solucio: documents oficials/02_pau25_fisica_MostraExercicis_optica.pdf
  pagines_solucio: [4]
format: nou
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - instruments òptics i l'ull
  - formació d'imatges amb lents i miralls
paraules_clau: [miopia, ull, lent divergent, lent correctora, ulleres, potència, diòptria, diagrama de rajos]
tipus: [càlcul, qualitativa, diagrama]
dificultat: 3
justificacio_dificultat: >-
  Cal interpretar el punt remot de l'ull miop per trobar la focal de la lent correctora i
  després fer càlcul i diagrama de rajos a escala amb una lent divergent.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Tipus de lent, focal i potència de la lent correctora de la miopia.
  - etiqueta: "b"
    punts: 1.25
    resum: Posició de la imatge d'un arbre a 12 m i diagrama de rajos a escala.
figures:
  - fitxer: fig1.png
    on: enunciat
    descripcio: Quadrícula x-y (m) amb la lent a x = 0 i un arbre a x = -12 m per dibuixar el diagrama de rajos
  - fitxer: sol_fig1.png
    on: solucio
    descripcio: Diagrama de rajos resolt amb els focus f i f' i la imatge virtual de l'arbre a -3 m
solucio_oficial: true
revisat: false
notes: >-
  L'enunciat no indica els punts per apartat; s'han repartit a parts iguals (1,25 + 1,25),
  que coincideix amb la suma de les puntuacions parcials de la resolució. L'enunciat original
  inclou la solució curta "Solució: -4 m, -0.25 D, 3 m". A la resolució (a) el terme
  "1/(-∞)" surt mal compost al PDF ("CX)"); s'ha transcrit com -\infty.
