notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació dels apartats;
  s'ha pres la de la pauta (1 + 1). A l'exponent de la pauta falta el signe de
  multiplicar («e^{−0,086424,06}» per 0,0864·24,06; vegeu el % DUBTE). La partícula β
  s'escriu a la pauta amb superíndex «−1» i l'antineutrí amb subíndex «e−»; es
  mantenen així, com els símbols dels nuclis en cursiva. A l'apartat b les dues
  expressions estan agrupades amb una clau que dona λ = 3,41·10⁻¹² m (0,6 p). Les
  dades de l'enunciat inclouen la massa de l'electró, que no cal per resoldre'l.
