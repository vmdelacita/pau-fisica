id: 2021_ext_s1_P6_violins-nivell-intensitat
titol: Nivell d'intensitat sonora de diversos violins
resum: >-
  Augment del nivell d'intensitat del so (en decibels) quan cinc violins toquen alhora
  en lloc d'un de sol, i càlcul de la intensitat amb què toca un sol violí a partir del
  nivell d'intensitat mesurat quan els cinc violins passen a tocar més fort.
