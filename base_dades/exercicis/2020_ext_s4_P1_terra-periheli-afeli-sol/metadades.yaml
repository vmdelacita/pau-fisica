id: 2020_ext_s4_P1_terra-periheli-afeli-sol
titol: Òrbita el·líptica de la Terra, periheli i afeli
resum: >-
  Dibuix de l'òrbita el·líptica de la Terra amb la posició a l'hivern, justificació
  energètica que la velocitat és mínima a l'afeli i càlcul de la distància a l'afeli
  (segona llei de Kepler o conservació de l'energia); camp gravitatori a la superfície
  del Sol i pes d'una massa de 10 kg.
