justificacio_dificultat: >-
  Problema PAU típic d'òrbites el·líptiques: cal raonar amb la conservació de l'energia
  per justificar la velocitat mínima i aplicar la conservació del moment angular per a la
  distància a l'afeli; el segon apartat és una aplicació directa.
