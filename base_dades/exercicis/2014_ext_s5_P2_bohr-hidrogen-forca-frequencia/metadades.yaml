justificacio_dificultat: >-
  Combina la llei de Coulomb amb la dinàmica del moviment circular per obtenir la
  freqüència, i cal deduir l'energia mecànica com a suma de la cinètica (a partir de la
  força centrípeta) i la potencial elèctrica.
