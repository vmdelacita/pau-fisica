id: 2014_ext_s5_P2_bohr-hidrogen-forca-frequencia
titol: Força elèctrica, freqüència i energia de l'electró en el model de Bohr
resum: >-
  En l'òrbita mínima del model de Bohr de l'àtom d'hidrogen (r = 5,29·10⁻¹¹ m), càlcul de
  la força elèctrica sobre l'electró i de la seva freqüència de gir; energia mecànica de
  l'electró en aquesta òrbita.
