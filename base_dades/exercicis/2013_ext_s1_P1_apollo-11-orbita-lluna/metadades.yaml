id: 2013_ext_s1_P1_apollo-11-orbita-lluna
titol: Mòdul Columbia de l'Apollo 11 en òrbita lunar
resum: >-
  A partir de l'altura i el període orbital del mòdul de comandament Columbia al voltant
  de la Lluna, càlcul de la massa de la Lluna i de la intensitat del camp gravitatori a la
  superfície lunar; velocitat d'escapament des de la superfície de la Lluna.
