notes: >-
  La velocitat obtinguda (1,57e8 m/s) és relativista, però l'enunciat demana negligir els
  efectes relativistes. La pauta usa 1,121e-14 J i 1,101e-14 J als càlculs finals (valors amb
  una xifra més); es transcriu tal com és.
