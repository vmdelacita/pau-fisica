notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat; segons la pauta cada apartat val 1 punt. L'enunciat i la pauta diuen «1 460 MeV»; el raig gamma real del potassi 40
  és d'1 460 keV (1,460 MeV), i amb 1 460 MeV la disminució de massa (2,60·10^-27 kg)
  seria més gran que la massa d'un nucleó. Es transcriu tal com és (DUBTE a solucio.tex).
  A la pauta, la penalització per no posar l'antineutrí s'escriu «-0-2p» i s'ha
  transcrit com a -0,2 p. La pauta escriu els resultats de l'apartat b amb punt decimal i
  s'han passat a coma.
