id: 2014_ext_s5_P4A_fil-suspes-camp-magnetic-espira
titol: Fil conductor suspès per un camp magnètic i espira sense FEM induïda
resum: >-
  Mòdul, direcció i sentit del camp magnètic uniforme que manté suspès en l'aire un fil
  rectilini de 5 m i 100 g pel qual circula un corrent de 0,3 A; FEM induïda en una
  espira feta amb el fil, situada paral·lela al pla xy, per un camp variable contingut en
  aquest pla (flux nul).
