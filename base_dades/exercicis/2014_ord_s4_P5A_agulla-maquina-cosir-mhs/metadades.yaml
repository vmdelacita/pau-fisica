titol: Agulla d'una màquina de cosir en MHS
resum: >-
  Agulla d'una màquina de cosir que oscil·la en MHS entre dos punts separats 20 mm i fa
  1 800 puntades per minut: freqüència en Hz i equació del moviment si comença a la
  posició més alta; velocitat i acceleració màximes.
