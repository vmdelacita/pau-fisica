id: 2025_mostra_optica_P1_lupa-taula-lampada
titol: Lupa de taula i imatge d'una làmpada
resum: >-
  Càlcul de la distància focal i la potència d'una lupa a partir de l'augment lateral
  i la distància al paper; posició d'una làmpada del sostre la imatge de la qual es
  forma sobre la taula.
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: optica
  exercici: 1
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_MostraExercicis_optica.pdf
  pagines_enunciat: [1]
  pdf_solucio: documents oficials/02_pau25_fisica_MostraExercicis_optica.pdf
  pagines_solucio: [3]
format: nou
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - formació d'imatges amb lents i miralls
  - instruments òptics i l'ull
paraules_clau: [lupa, lent convergent, equació de la lent, augment lateral, distància focal, potència, diòptria]
tipus: [càlcul]
dificultat: 2
justificacio_dificultat: >-
  Aplicació directa de l'equació de les lents primes i de l'augment lateral en dos
  passos; l'única subtilesa és el conveni de signes i interpretar la distància final.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Distància focal i potència de la lupa a partir de l'augment lateral.
  - etiqueta: "b"
    punts: 1.25
    resum: Distància entre l'escriptori i la làmpada que la lupa enfoca sobre el paper.
figures:
  - fitxer: fig1.png
    on: enunciat
    descripcio: Fotografia d'una lupa de taula sobre un paper
solucio_oficial: true
revisat: false
notes: >-
  L'enunciat no indica els punts per apartat; s'han repartit a parts iguals (1,25 + 1,25),
  que coincideix amb la suma de les puntuacions parcials de la resolució. L'enunciat original
  inclou la solució curta "Solució: 20 cm, 5 D, 242 cm". A la resolució (a) el numerador
  "-10 20" apareix sense el signe "+" (defecte de tipografia); s'ha transcrit "-10+20".
