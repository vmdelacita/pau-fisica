id: 2021_ord_s2_P8_efecte-fotoelectric-rubidi
titol: Fotons de llum vermella i verda i efecte fotoelèctric al rubidi
resum: >-
  Freqüència i energia d'un fotó i d'un mol de fotons de llum vermella (750 nm) i verda
  (550 nm); longitud d'ona llindar del rubidi, si les dues radiacions arrenquen electrons
  i energia cinètica adquirida, i gràfica esquemàtica de l'energia cinètica màxima en
  funció de l'energia dels fotons incidents.
