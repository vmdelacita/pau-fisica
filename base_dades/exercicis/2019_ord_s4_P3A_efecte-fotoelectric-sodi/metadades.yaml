id: 2019_ord_s4_P3A_efecte-fotoelectric-sodi
titol: Efecte fotoelèctric en una placa de sodi
resum: >-
  Equació del balanç energètic de l'efecte fotoelèctric, significat dels termes i
  deducció de la longitud d'ona llindar; energia cinètica màxima dels fotoelectrons i
  potencial de frenada per a una placa de sodi il·luminada amb radiació de 660 THz.
