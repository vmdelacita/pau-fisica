id: 2023_ext_s2_P4_espectrometre-masses-neo
titol: Espectròmetre de masses amb selector de velocitats per a ions de neó
resum: >-
  Selector de velocitats amb camps elèctric i magnètic creuats per a ions negatius: diferència
  de potencial entre plaques, polaritat, diagrama de forces i funcionament per a ions positius;
  trajectòria semicircular en un camp magnètic i distància d'impacte de l'ió 20Ne−.
font:
  tipus: examen
  any: 2023
  convocatoria: extraordinaria
  serie: 2
  exercici: 4
  opcio: null
  pdf_enunciat: examenes/pau_fisi23sl.pdf
  pagines_enunciat: [8]
  pdf_solucio: examenes/pau_fisi23sp.pdf
  pagines_solucio: [9, 10, 11]
format: antic
bloc: Camps electromagnètics
blocs_secundaris: []
subtemes:
  - selector de velocitats, espectròmetre i ciclotró
  - moviment de càrregues en camps magnètics
  - moviment de càrregues en camps elèctrics
  - potencial i energia potencial elèctrica
paraules_clau: [espectròmetre de masses, selector de velocitats, força de Lorentz, regla de la mà dreta, ions negatius, neó, trajectòria circular, diferència de potencial]
tipus: [càlcul, diagrama, qualitativa]
dificultat: 3
justificacio_dificultat: >-
  Problema clàssic d'espectròmetre, però cal raonar amb cura els sentits de les forces per a
  càrregues negatives, la polaritat de les plaques i el cas d'ions positius.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Diferència de potencial del selector, placa a potencial alt i baix, forces sobre l'ió i validesa per a ions positius.
  - etiqueta: "b"
    punts: 1.25
    resum: Trajectòria dels ions en el camp magnètic i distància d'impacte de l'ió 20Ne− (dues vegades el radi).
