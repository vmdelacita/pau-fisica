  - fitxer: sol_fig3.png
    on: solucio
    descripcio: Eixos 3D amb les forces sobre una càrrega positiva al selector
  - fitxer: sol_fig4.png
    on: solucio
    descripcio: Eixos 3D amb v, B i F_M per a l'ió negatiu i trajectòria semicircular fins a la pantalla
