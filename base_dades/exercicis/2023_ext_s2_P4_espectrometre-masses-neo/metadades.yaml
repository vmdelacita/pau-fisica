notes: >-
  Les puntuacions parcials de la pauta apareixen després de cada pas; aquí es posen a l'inici
  del bloc que puntuen. A la pauta, sol_fig2 i sol_fig3 apareixen una al costat de l'altra.
  La figura 2 de l'enunciat és al costat de l'apartat b; s'ha posat entre els apartats a i b.
