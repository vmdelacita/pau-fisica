    descripcio: Selector de velocitats amb plaques separades 1,50 cm i camp magnètic sortint
  - fitxer: fig2.png
    on: enunciat
    descripcio: Regió amb camp magnètic entrant i pantalles laterals on entra l'ió amb velocitat v
  - fitxer: sol_fig1.png
