id: 2014_ord_s3_P1_meteosat-orbita-geostacionaria
titol: Meteosat en òrbita geostacionària
resum: >-
  Càlcul de l'altura sobre la superfície terrestre del satèl·lit geostacionari Meteosat;
  energia cinètica del satèl·lit i energia mínima necessària perquè s'allunyi
  indefinidament de la Terra.
