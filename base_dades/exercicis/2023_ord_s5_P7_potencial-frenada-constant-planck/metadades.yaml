id: 2023_ord_s5_P7_potencial-frenada-constant-planck
titol: Mètode del potencial invers i constant de Planck
resum: >-
  En una cel·la fotoelèctrica amb el mètode del potencial invers, cal raonar quina placa
  va a potencial alt, relacionar potencial de frenada i freqüència, determinar h a
  partir d'una taula de dades i calcular la freqüència llindar i si hi ha emissió amb
  llum de 350 nm.
