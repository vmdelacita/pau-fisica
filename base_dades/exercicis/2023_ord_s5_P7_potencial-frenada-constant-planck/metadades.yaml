  pagines_enunciat: [30]
  pdf_solucio: examenes/pau_fisi23jp.pdf
  pagines_solucio: [30, 31]
format: antic
curriculum: actual
bloc: Física relativista, quàntica i nuclear
blocs_secundaris: [Camps electromagnètics]
subtemes:
  - efecte fotoelèctric
  - fotons i energia de la radiació
paraules_clau: [efecte fotoelèctric, potencial de frenada, mètode del potencial invers, constant de Planck, funció de treball, freqüència llindar, cel·la fotoelèctrica, Einstein]
tipus: [experimental, càlcul, qualitativa, context-històric]
dificultat: 4
justificacio_dificultat: >-
  Cal raonar el sentit del camp de frenada per a càrregues negatives, deduir la relació
  V_f(f) i obtenir h a partir de dades experimentals; la interpretació de dades i el
  raonament sobre el muntatge van més enllà d'un exercici estàndard.
punts_total: 2.5
