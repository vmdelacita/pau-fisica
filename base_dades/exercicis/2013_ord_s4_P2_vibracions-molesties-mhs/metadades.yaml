  Amplitud d'un moviment vibratori harmònic de 6,0 Hz amb una acceleració màxima de
  6,0 m/s² (llindar de molèsties) i constant elàstica d'una molla perquè una massa de
  85 kg oscil·li a 6,0 Hz.
