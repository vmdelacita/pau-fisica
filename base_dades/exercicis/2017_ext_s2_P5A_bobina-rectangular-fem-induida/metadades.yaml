id: 2017_ext_s2_P5A_bobina-rectangular-fem-induida
titol: Força electromotriu induïda en una bobina rectangular que gira
resum: >-
  Equació de la fem induïda en funció del temps en una bobina rectangular de 300
  espires que gira a 60 rev/min en un camp magnètic uniforme de 0,4 T; corrent màxim
  si la bobina té una resistència d'1,0 Ω.
