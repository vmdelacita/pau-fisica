id: 2020_ord_s1_P1_freddie-mercury-veu-so
titol: La veu de Freddie Mercury i el concert de Rock in Rio
resum: >-
  Longituds d'ona dels sons més greus i més aguts del registre vocal de Freddie Mercury
  a partir de les freqüències; nivell d'intensitat sonora a 1 km d'un concert on
  350 000 persones canten alhora, considerat com una font puntual.
