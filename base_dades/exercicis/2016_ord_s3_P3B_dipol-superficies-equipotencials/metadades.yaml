id: 2016_ord_s3_P3B_dipol-superficies-equipotencials
titol: Superfícies equipotencials d'un dipol elèctric
resum: >-
  Valors de potencial de les superfícies equipotencials d'un dipol a partir del potencial
  en un punt P i dibuix aproximat de les línies de camp; càlcul del valor de les càrregues
  a partir del potencial a P.
