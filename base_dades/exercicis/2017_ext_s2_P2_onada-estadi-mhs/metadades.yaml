id: 2017_ext_s2_P2_onada-estadi-mhs
titol: L'onada del públic en un estadi
resum: >-
  L'onada que fa el públic d'un estadi modelitzada com una ona: tipus d'ona, longitud
  d'ona i pulsació a partir de la distància entre espectadors que es mouen igual i del
  període; equació del MHS d'un espectador que parteix de la posició mínima.
