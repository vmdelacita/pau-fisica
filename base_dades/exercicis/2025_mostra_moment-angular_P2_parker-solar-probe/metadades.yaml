id: 2025_mostra_moment-angular_P2_parker-solar-probe
titol: Òrbita de la Parker Solar Probe a partir d'una gràfica
resum: >-
  Lectura d'una gràfica distància-temps de la Parker Solar Probe per comptar voltes i
  obtenir l'eix major de l'òrbita; esquema de l'òrbita amb els vectors velocitat i
  acceleració i justificació del punt de velocitat màxima (energia, Kepler i moment angular).
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: moment-angular
  exercici: 2
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_MostraExercicis_moment-angular.pdf
  pagines_enunciat: [2]
  pdf_solucio: documents oficials/02_pau25_fisica_MostraExercicis_moment-angular.pdf
  pagines_solucio: [2, 3]
format: nou
bloc: Camps gravitatoris
blocs_secundaris: []
subtemes:
  - òrbites el·líptiques i moment angular
  - lleis de Kepler
  - energia mecànica orbital
paraules_clau: [Parker Solar Probe, sonda solar, òrbita el·líptica, eix major, periheli, afeli, segona llei de Kepler, conservació del moment angular, radi solar]
tipus: [gràfic, diagrama, qualitativa]
dificultat: 4
justificacio_dificultat: >-
  Cal interpretar una gràfica real de distància a la superfície solar (i recordar sumar el
  diàmetre del Sol) i justificar qualitativament la velocitat màxima amb diversos principis.
punts_total: 2.0
apartats:
  - etiqueta: "a"
    punts: 1
    resum: Nombre de voltes en 1000 dies i eix major de l'òrbita en radis solars.
  - etiqueta: "b"
    punts: 1
    resum: Esquema de l'òrbita amb A, B, C i vectors v i a a B; posició de velocitat màxima justificada.
figures:
  - fitxer: fig1.png
    on: enunciat
    descripcio: Gràfica de la distància de la Parker Solar Probe a la superfície del Sol (R_S) en funció dels dies des del llançament, amb els punts A, B i C
  - fitxer: sol_fig1.png
    on: solucio
    descripcio: Òrbita el·líptica entre A i C amb les cotes 35 R_S, 2 R_S i 200 R_S i els vectors a i v al punt B
solucio_oficial: true
revisat: false
notes: >-
  L'original puntua els apartats amb [1 punt] cadascun, de manera que l'exercici val 2 punts
  (no 2,5); s'ha mantingut la puntuació original. L'enunciat de l'apartat b repeteix dues
  vegades la pregunta "En quina posició la velocitat de la nau és màxima?" (transcrit tal
  com és). La pauta només indica puntuacions parcials implícites a l'apartat a (0,8 p per
  l'eix major). A la resolució b l'energia potencial s'escriu amb M_T en lloc de la massa
  del Sol (error de l'original, transcrit igual). L'esquema de la solució apareix entre
  els apartats a i b; s'ha posat al final de l'apartat a, on s'hi fa referència ("Del esquema").
