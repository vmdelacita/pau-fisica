id: 2017_ord_s1_P2_rele-bobina-imant
titol: Relé amb bobina i imant
resum: >-
  Sentit del corrent a la bobina d'un relé perquè atregui el pol nord d'un imant i
  dibuix de les línies de camp; efecte d'augmentar la intensitat, d'afegir un nucli
  ferromagnètic i de fer servir corrent altern.
