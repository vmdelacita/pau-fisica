id: 2018_ord_s1_P3A_proto-espectrometre-camp-magnetic
titol: Protó i electró en un espectròmetre de masses
resum: >-
  Força magnètica (vector) sobre un protó que entra en un espectròmetre de masses amb
  velocitat i camp magnètic donats; camp magnètic (mòdul, direcció i sentit) necessari
  perquè un electró amb la mateixa velocitat segueixi la mateixa trajectòria.
