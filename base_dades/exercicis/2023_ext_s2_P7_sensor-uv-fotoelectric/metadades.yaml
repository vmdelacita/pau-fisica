id: 2023_ext_s2_P7_sensor-uv-fotoelectric
titol: Sensor d'ultraviolat basat en l'efecte fotoelèctric
resum: >-
  Càlcul de la longitud d'ona llindar necessària perquè una cèl·lula fotoelèctrica il·luminada
  amb llum de 300 nm emeti electrons d'almenys 1 eV; longituds d'ona llindar del tungstè,
  magnesi i potassi i elecció raonada del material.
