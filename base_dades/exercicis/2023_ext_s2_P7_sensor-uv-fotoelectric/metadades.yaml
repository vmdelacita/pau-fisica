paraules_clau: [sensor ultraviolat, cèl·lula fotoelèctrica, funció de treball, longitud d'ona llindar, freqüència llindar, tungstè, magnesi, potassi]
tipus: [càlcul, qualitativa]
dificultat: 2
justificacio_dificultat: >-
  Aplicació directa de l'equació d'Einstein de l'efecte fotoelèctric i de λ0 = hc/W0 amb
  canvis d'unitats; la tria del material és un raonament senzill.
