notes: >-
  Les puntuacions parcials de la pauta apareixen després de cada pas; aquí es posen a l'inici
  del bloc que puntuen. Errades a la pauta transcrites tal com són (DUBTE): a l'apartat b escriu
  λ_{0,Mg} = 542 nm quan hauria de ser λ_{0,K}, i diu que les longituds d'ona llindar "del
