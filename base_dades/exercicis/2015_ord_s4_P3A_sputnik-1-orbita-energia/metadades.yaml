id: 2015_ord_s4_P3A_sputnik-1-orbita-energia
titol: Òrbita i energia de posada en òrbita de l'Sputnik 1
resum: >-
  Raonament de per què l'Sputnik 1 (període de 96,2 min) no és geostacionari i càlcul de l'altura de la seva òrbita circular; energia que cal subministrar per situar-lo en òrbita des de Baikonur tenint en compte la velocitat deguda a la rotació terrestre.
