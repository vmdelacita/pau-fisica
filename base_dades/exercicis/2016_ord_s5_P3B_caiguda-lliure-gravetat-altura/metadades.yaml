id: 2016_ord_s5_P3B_caiguda-lliure-gravetat-altura
titol: Salt en caiguda lliure des de 330 km d'altura
resum: >-
  Acceleració de la gravetat a 330 km i a 50 km d'altura, i velocitat a 80 km d'altura
  d'un aventurer que es deixa caure des del repòs, per conservació de l'energia amb
  l'energia potencial gravitatòria.
