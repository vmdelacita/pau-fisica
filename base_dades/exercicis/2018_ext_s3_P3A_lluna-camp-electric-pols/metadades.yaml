id: 2018_ext_s3_P3A_lluna-camp-electric-pols
titol: Camp elèctric lunar i partícules de pols en suspensió
resum: >-
  Relació càrrega/massa i signe de la càrrega perquè una partícula de pols estigui en
  equilibri a la cara il·luminada de la Lluna; força total sobre una partícula carregada
  a la cara fosca i temps que triga a recórrer 10 m partint del repòs.
