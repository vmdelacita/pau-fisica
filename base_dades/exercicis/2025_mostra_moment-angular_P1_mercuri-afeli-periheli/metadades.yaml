notes: >-
  Exercici sense apartats ni puntuació indicada: s'ha posat un únic apartat de 2,5 punts.
  La resolució no té puntuacions parcials. Les distàncies de l'enunciat (6,99·10^10 km i
  4,60·10^10 km) no corresponen a les reals de Mercuri (~6,98·10^7 km i ~4,60·10^7 km), però
  la resolució les fa servir de manera coherent (10^13 m) i el resultat de la velocitat no
  en depèn; s'han transcrit tal com són.
