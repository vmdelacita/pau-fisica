id: 2024_ord_s1_P6_poloni-alfa-atom-heli
titol: Desintegració alfa del poloni-210 i formació d'un àtom d'heli
resum: >-
  Equació de la desintegració alfa del Po-210 i activitat d'una mostra de 5 mg al cap
  d'una setmana. Treball del camp elèctric en portar successivament dos electrons des
  de l'infinit fins a la partícula alfa i energia potencial electrostàtica de la
  configuració final.
