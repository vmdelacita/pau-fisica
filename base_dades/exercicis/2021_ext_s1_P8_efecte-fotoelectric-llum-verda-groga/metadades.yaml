id: 2021_ext_s1_P8_efecte-fotoelectric-llum-verda-groga
titol: Efecte fotoelèctric amb llum verda i groga
resum: >-
  A partir del potencial de frenada amb llum verda, càlcul de la funció de treball
  d'una superfície metàl·lica i la freqüència llindar d'extracció de fotoelectrons;
  energia dels fotons i potencial de frenada quan s'il·lumina la mateixa superfície
  amb llum groga.
