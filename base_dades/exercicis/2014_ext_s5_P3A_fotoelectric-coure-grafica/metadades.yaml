  - fotons i energia de la radiació
paraules_clau: [efecte fotoelèctric, coure, freqüència llindar, constant de Planck, pendent, energia cinètica, gràfica, velocitat dels electrons]
tipus: [càlcul, gràfic, qualitativa]
dificultat: 3
justificacio_dificultat: >-
  Cal interpretar la gràfica Ec–f (que no arriba a tallar l'eix de freqüències als punts
  marcats) per extrapolar la freqüència llindar i obtenir h del pendent, i després aplicar
  l'equació d'Einstein per calcular la velocitat.
