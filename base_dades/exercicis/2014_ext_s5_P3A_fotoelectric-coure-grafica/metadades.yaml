  pdf_enunciat: examenes/pau_fisi14sl.pdf
  pagines_enunciat: [2]
  pdf_solucio: examenes/pau_fisi14sp.pdf
  pagines_solucio: [2]
format: antic
curriculum: actual
bloc: Física relativista, quàntica i nuclear
