id: 2014_ext_s5_P3A_fotoelectric-coure-grafica
titol: Efecte fotoelèctric en el coure a partir d'una gràfica
resum: >-
  A partir de la gràfica de l'energia cinètica dels electrons en funció de la freqüència
  de la llum que il·lumina una superfície de coure, explicació i càlcul de la freqüència
  llindar; càlcul de la constant de Planck (pendent) i de la velocitat dels electrons
  emesos per a una longitud d'ona de 1,2·10⁻⁷ m.
font:
  tipus: examen
