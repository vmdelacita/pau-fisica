solucio_oficial: true
revisat: false
notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat;
  segons la pauta cada apartat val 1 punt. A la pauta, el selector i el diagrama de forces
  apareixen l'un al costat de l'altre, amb la puntuació (0,3 p) a sota a la dreta; s'han
  retallat com a dues figures. Els punts decimals de la pauta (0.04, 1.78) s'han passat a
  coma; «del electró», «es paral·lela» i «per tan» es mantenen com a l'original.
