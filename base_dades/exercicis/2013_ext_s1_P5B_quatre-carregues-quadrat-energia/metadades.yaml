id: 2013_ext_s1_P5B_quatre-carregues-quadrat-energia
titol: Quatre càrregues iguals als vèrtexs d'un quadrat
resum: >-
  Energia necessària per formar un sistema de quatre càrregues positives iguals situades
  als vèrtexs d'un quadrat de costat √2 m; càrrega negativa que cal situar al centre
  perquè la força electrostàtica sobre cada càrrega sigui nul·la.
