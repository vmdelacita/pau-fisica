id: 2015_ord_s2_P1_teranyina-insecte-mhs
titol: Vibració d'un insecte atrapat en una teranyina (MHS)
resum: >-
  Càlcul de la constant elàstica d'una teranyina a partir de la massa d'un insecte i la
  freqüència de vibració; massa d'un altre insecte a partir del període i acceleració
  màxima per a una amplitud donada.
