id: 2016_ord_s3_P1_forat-negre-estrella-orbita
titol: Estrella en òrbita al voltant del forat negre A0620-00
resum: >-
  Deducció del radi d'una òrbita circular a partir de la massa del cos central i del
  període i càlcul del radi de l'òrbita d'una estrella al voltant del forat negre
  A0620-00; velocitat lineal i acceleració centrípeta de l'estrella i representació dels
  dos vectors.
