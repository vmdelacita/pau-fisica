id: 2018_ext_s3_P2_grafica-mhs-ona-sonora
titol: Gràfica d'un MHS i ona sonora generada
resum: >-
  Amplitud, freqüència i equació x(t) d'un MHS a partir de la gràfica posició-temps i
  gràfica d'un MHS amb la meitat de freqüència; efecte de la reflexió, del canvi de
  medi i del moviment del focus (Doppler) sobre la freqüència i la longitud d'ona del so.
font:
  tipus: examen
  any: 2018
  convocatoria: extraordinaria
  serie: 3
  exercici: 2
