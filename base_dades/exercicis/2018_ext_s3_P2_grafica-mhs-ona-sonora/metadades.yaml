  pdf_enunciat: examenes/pau_fisi18sl.pdf
  pagines_enunciat: [2]
  pdf_solucio: examenes/pau_fisi18sp.pdf
  pagines_solucio: [2]
format: antic
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - moviment harmònic simple
  - reflexió i refracció
  - efecte Doppler
  - ones sonores i nivell d'intensitat
paraules_clau: [gràfica posició-temps, amplitud, freqüència, equació del moviment, ona sonora, reflexió, canvi de medi, efecte Doppler]
tipus: [gràfic, càlcul, qualitativa]
dificultat: 2
justificacio_dificultat: >-
  Lectura directa de l'amplitud i el període d'una gràfica, dibuix d'una gràfica amb la
  meitat de freqüència i tres qüestions qualitatives estàndard sobre ones.
