id: 2022_ord_s2_P1_lluna-camp-gravitatori-escapament
titol: Camp gravitatori i escapament al sistema Terra-Lluna
resum: >-
  Deducció de g(R, T) per a un satèl·lit en òrbita circular i càlcul per a la Lluna;
  deducció de l'energia cinètica mínima d'escapament i comparació entre la Terra i la
  Lluna a partir dels seus quocients de massa i radi.
