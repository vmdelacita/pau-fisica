id: 2018_ord_s1_P4A_vaixell-onades-mhs
titol: Vaixell a la deriva moguda per les ones (MHS)
resum: >-
  Equació del moviment harmònic simple vertical d'un vaixell que es mou 2,00 m del punt
  més alt al més baix cada 6,28 s, partint del punt més alt; velocitat i acceleració
  inicials.
