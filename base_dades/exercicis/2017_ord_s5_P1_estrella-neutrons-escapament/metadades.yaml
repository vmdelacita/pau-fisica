id: 2017_ord_s5_P1_estrella-neutrons-escapament
titol: Camp gravitatori i velocitat d'escapament d'una estrella de neutrons
resum: >-
  Mòdul del camp gravitatori a la superfície d'una estrella de neutrons de massa i radi
  donats; deducció, a partir de la conservació de l'energia mecànica, i càlcul de la
  velocitat d'escapament des de la seva superfície.
