  pagines_enunciat: [6]
  pdf_solucio: documents oficials/01_pau25_fisica_0c.pdf
  pagines_solucio: [6, 7]
format: nou
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - moviment harmònic simple
  - energia del MHS
paraules_clau: [molla, disc giratori, ombres, moviment circular uniforme, fase inicial, constant elàstica, energia cinètica, energia potencial elàstica]
tipus: [càlcul, gràfic, experimental]
dificultat: 3
justificacio_dificultat: >-
  Cal relacionar el MHS amb la projecció d'un moviment circular (context experimental
  poc habitual) i determinar la fase inicial, però els càlculs i la gràfica d'energies
  són estàndard.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Equació de la posició de les ombres amb t = 0 al punt més baix; energia mecànica i constant elàstica.
  - etiqueta: "b"
    punts: 1.25
    resum: Equacions v(t) i E_c(t); gràfica d'E_m, E_p i E_c en funció de la posició.
