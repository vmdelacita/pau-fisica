id: 2025_model_s0_E3_molla-disc-mhs-energia
titol: Ombres d'una molla i d'un disc en rotació (MHS i moviment circular)
resum: >-
  Equivalència entre el MHS vertical d'una massa penjada d'una molla i la projecció
  d'un moviment circular uniforme: equació de la posició, constant elàstica i energia
  mecànica; equacions de la velocitat i l'energia cinètica, i gràfica de les energies
  mecànica, potencial i cinètica en funció de la posició.
font:
  tipus: model
  any: 2025
  convocatoria: model
  serie: 0
  exercici: 3
  opcio: null
