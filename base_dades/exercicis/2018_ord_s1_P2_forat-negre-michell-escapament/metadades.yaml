id: 2018_ord_s1_P2_forat-negre-michell-escapament
titol: Forat negre de Michell i velocitat d'escapament
resum: >-
  Massa d'un cos esfèric amb la densitat del Sol i 500 vegades el seu radi i velocitat
  d'escapament des de la seva superfície (comparada amb la de la llum); intensitat del camp
  gravitatori a la superfície i força sobre una massa d'1 µg.
