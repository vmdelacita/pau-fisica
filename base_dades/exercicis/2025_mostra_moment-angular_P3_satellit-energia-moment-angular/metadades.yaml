id: 2025_mostra_moment-angular_P3_satellit-energia-moment-angular
titol: Energia mecànica d'un satèl·lit en funció del moment angular
resum: >-
  Demostració que l'energia mecànica d'un satèl·lit en òrbita el·líptica es pot expressar
  en funció del moment angular, del perigeu, de l'apogeu i de la velocitat al perigeu;
  càlcul de la velocitat a l'apogeu i de l'energia mecànica.
