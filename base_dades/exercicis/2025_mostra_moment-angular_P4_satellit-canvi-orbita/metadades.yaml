id: 2025_mostra_moment-angular_P4_satellit-canvi-orbita
titol: Satèl·lit que passa d'òrbita circular a el·líptica
resum: >-
  Període i velocitat d'un satèl·lit en òrbita circular a 3630 km d'altura; després d'un
  augment de velocitat al punt P passa a una òrbita el·líptica: energies cinètica,
  potencial i mecànica a P i A, i moment angular als dos punts.
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: moment-angular
  exercici: 4
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_MostraExercicis_moment-angular.pdf
  pagines_enunciat: [6]
  pdf_solucio: documents oficials/02_pau25_fisica_MostraExercicis_moment-angular.pdf
  pagines_solucio: [6, 7]
format: nou
bloc: Camps gravitatoris
blocs_secundaris: []
subtemes:
  - òrbites circulars i satèl·lits
  - òrbites el·líptiques i moment angular
  - energia mecànica orbital
  - energia potencial i potencial gravitatori
paraules_clau: [satèl·lit, òrbita circular, òrbita el·líptica, perigeu, apogeu, energia mecànica, conservació del moment angular, maniobra orbital]
tipus: [càlcul, qualitativa]
dificultat: 3
justificacio_dificultat: >-
  Problema de diversos passos que combina òrbita circular, conservació de l'energia i del
  moment angular en una òrbita el·líptica; càlculs llargs però guiats.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Període i velocitat del satèl·lit en l'òrbita circular.
  - etiqueta: "b"
    punts: 1.25
    resum: Energies cinètica, potencial i mecànica a P i A de l'òrbita el·líptica i moment angular a A i P.
figures:
  - fitxer: fig1.png
    on: enunciat
    descripcio: Terra amb l'òrbita circular i l'òrbita el·líptica, amb el punt P (perigeu) i A (apogeu)
solucio_oficial: true
revisat: false
notes: >-
  La resolució no té puntuacions parcials. Errades de l'original transcrites tal com són:
  a l'apartat a la igualtat de forces no porta la massa m al membre de la dreta; a l'apartat b
  el segon càlcul diu "En el punt P" i usa h_p quan es refereix al punt A, i l'energia
  mecànica hi apareix com -3,06·10^10 J (abans -3,07·10^10 J); "4.41 10^3" amb punt decimal
  i sense signe de multiplicació. La resolució no explicita separadament les energies
  cinètica i potencial a P ni la potencial a A, tot i que l'enunciat les demana.
