id: 2018_ord_s5_P5A_bobina-gir-fem-alterna
titol: "Bobina que gira en un camp magnètic uniforme: fem alterna"
resum: >-
  Equació de la força electromotriu d'una bobina de 200 espires quadrades que gira a 10 voltes per segon en un camp magnètic uniforme i valor a t = 1,28 s; gràfica de la fem en funció del temps i valors màxim i eficaç.
font:
  tipus: examen
  any: 2018
  convocatoria: ordinaria
  serie: 5
  exercici: 5
  opcio: A
  pdf_enunciat: examenes/pau_fisi18jl.pdf
  pagines_enunciat: [7]
  pdf_solucio: examenes/pau_fisi18jp.pdf
  pagines_solucio: [11]
format: antic
curriculum: actual
bloc: Camps electromagnètics
blocs_secundaris: []
subtemes:
  - flux magnètic i inducció (Faraday-Lenz)
  - generadors, motors i transformadors
paraules_clau: [bobina, espires, generador, corrent altern, força electromotriu induïda, llei de Faraday, valor eficaç, valor màxim]
tipus: [càlcul, gràfic]
dificultat: 3
justificacio_dificultat: >-
  Cal construir el flux en funció del temps, derivar-lo amb la llei de Faraday, avaluar-lo i representar la fem sinusoidal: problema PAU típic d'alternador.
punts_total: 2
