    descripcio: "Gràfica de la fem sinusoidal en funció del temps entre 0 i 0,20 s amb el valor màxim indicat"
solucio_oficial: true
revisat: false
notes: >-
  PDF escanejat: transcripció visual. A la pauta la gràfica és a la dreta i porta «0,2 p» en vermell al costat: s'ha esborrat del retall i s'ha transcrit com a \punts{0,2}. DUBTE: la pauta escriu «ω = 2π rad» però fa servir ω = 20π rad/s (10 voltes per segon). DUBTE: la pauta dona ε(1,28 s) = 0,247 V, que correspon a calcular el sinus en graus; en radians ε = 0,251·sin(25,6π) ≈ −0,239 V. Transcrit tal com és.
