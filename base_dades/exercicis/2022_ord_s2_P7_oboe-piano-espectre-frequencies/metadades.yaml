  pagines_enunciat: [13]
  pdf_solucio: examenes/pau_fisi22jp.pdf
  pagines_solucio: [15, 16]
format: antic
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - ressonància i harmònics en tubs i cordes
  - ones sonores i nivell d'intensitat
paraules_clau: [espectre de freqüències, harmònics, tub obert-tancat, corda amb dos extrems fixos, oboè, piano, nivell d'intensitat sonora, potència sonora, semiesfera]
tipus: [gràfic, qualitativa, càlcul]
dificultat: 3
justificacio_dificultat: >-
  Cal interpretar l'espectre per identificar la freqüència fonamental i raonar, a partir
  de les condicions de frontera d'un tub obert-tancat i d'una corda amb els dos extrems
  fixos, quin instrument és compatible amb els harmònics observats; l'apartat b combina
  el nivell d'intensitat sonora amb el repartiment entre cinc fonts i l'àrea d'una
  semiesfera.
