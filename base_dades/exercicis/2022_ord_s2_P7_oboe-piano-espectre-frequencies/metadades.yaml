id: 2022_ord_s2_P7_oboe-piano-espectre-frequencies
titol: Identificació d'un instrument musical a partir del seu espectre
resum: >-
  A partir d'un espectre de freqüències, determinació de la freqüència fonamental,
  identificació de si l'instrument és un oboè o un piano segons els harmònics presents,
  i càlcul de la llargària del tub; càlcul de la potència sonora de cada instrument d'un
  quintet a partir del nivell d'intensitat sonora conjunt.
