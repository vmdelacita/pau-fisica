id: 2013_ord_s4_P1_ceres-planeta-nan
titol: Camp gravitatori, escapament i òrbita del planeta nan Ceres
resum: >-
  Intensitat del camp gravitatori a la superfície de Ceres, velocitat d'escapament i
  energia mecànica mínima per escapar-ne; distància mitjana Ceres-Sol a partir del
  període orbital i de les dades de l'òrbita terrestre (tercera llei de Kepler).
