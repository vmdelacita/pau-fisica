id: 2021_ext_s1_P1_transit-planetari-exoplaneta
titol: Trànsit planetari d'un exoplaneta
resum: >-
  A partir d'un gràfic de lluminositat relativa en funció del temps que mostra el
  trànsit d'un exoplaneta, càlcul del període i el radi de l'òrbita (tercera llei de
  Kepler) i, a partir d'aquests, del mòdul de la velocitat i l'acceleració centrípeta
  del planeta.
font:
  tipus: examen
  any: 2021
  convocatoria: extraordinaria
  serie: 1
  exercici: 1
  opcio: null
  pdf_enunciat: examenes/pau_fisi21sl.pdf
  pagines_enunciat: [2]
  pdf_solucio: examenes/pau_fisi21sp.pdf
  pagines_solucio: [2]
format: antic
curriculum: actual
bloc: Camps gravitatoris
blocs_secundaris: []
subtemes:
