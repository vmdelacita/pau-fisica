  - òrbites circulars i satèl·lits
paraules_clau: [exoplaneta, trànsit planetari, lluminositat, tercera llei de Kepler, període orbital, radi orbital, velocitat orbital, acceleració centrípeta]
tipus: [càlcul, gràfic]
dificultat: 3
justificacio_dificultat: >-
  Cal llegir el període a partir d'un gràfic en un context poc habitual (mètode del
  trànsit) i després aplicar la tercera llei de Kepler i la cinemàtica circular; és un
  problema PAU típic, guiat en dos apartats encadenats.
