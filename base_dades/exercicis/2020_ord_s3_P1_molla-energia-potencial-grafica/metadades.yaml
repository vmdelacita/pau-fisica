id: 2020_ord_s3_P1_molla-energia-potencial-grafica
titol: Molla horitzontal a partir de la gràfica de l'energia potencial elàstica
resum: >-
  A partir de la gràfica de l'energia potencial elàstica en funció de l'elongació, càlcul de
  la constant elàstica de la molla i, amb el període d'oscil·lació, de la massa lligada;
  representació de l'energia cinètica i mecànica d'un MHS de 10 cm d'amplitud.
