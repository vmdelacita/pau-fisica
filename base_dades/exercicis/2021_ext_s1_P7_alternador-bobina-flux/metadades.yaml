id: 2021_ext_s1_P7_alternador-bobina-flux
titol: Flux i força electromotriu en un alternador
resum: >-
  Flux del camp magnètic a través d'una espira d'una bobina que gira dins un camp
  magnètic uniforme, per a orientació perpendicular i per a un angle qualsevol; a
  partir del flux, evolució temporal i valor màxim de la força electromotriu induïda
  en la bobina d'un alternador.
