dificultat: 3
justificacio_dificultat: >-
  Problema PAU típic d'alternador: cal calcular el flux en funció de l'angle, passar
  l'angle a funció del temps a partir de la freqüència de gir i aplicar la llei de
  Faraday per obtenir la fem, encadenant diversos passos amb funcions trigonomètriques.
