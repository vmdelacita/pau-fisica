dificultat: 3
justificacio_dificultat: >-
  Aplicació encadenada de relacions estàndard (E=hf, m=E/c^2, p=mc) i, a l'apartat b),
  un plantejament de conservació de l'energia mecànica en un context poc habitual
  (energia potencial gravitatòria d'un fotó) que cal saber interpretar correctament.
