id: 2022_ext_s3_P8_efecte-pound-rebka-fotons
titol: "L'experiment de Pound-Rebka: la gravetat i la freqüència dels fotons"
resum: >-
  Càlcul de la freqüència, la massa efectiva i la quantitat de moviment d'un fotó a
  partir de la seva energia, i càlcul de la variació d'energia i freqüència d'un fotó
  entre dos punts a diferent altura aplicant la conservació de l'energia mecànica
  (experiment de Pound-Rebka).
