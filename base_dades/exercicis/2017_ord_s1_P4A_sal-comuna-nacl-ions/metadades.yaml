id: 2017_ord_s1_P4A_sal-comuna-nacl-ions
titol: Enllaç iònic de la sal comuna (NaCl)
resum: >-
  Separació entre els ions Na⁺ i Cl⁻ a partir de l'energia potencial elèctrica del
  sistema; treball necessari per separar-los fins a 2 cm quan s'aplica un camp elèctric
  uniforme de 50,0 N/C a l'ió Na⁺.
