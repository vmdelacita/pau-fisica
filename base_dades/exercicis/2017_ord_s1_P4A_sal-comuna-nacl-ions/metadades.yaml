  - camp elèctric i llei de Coulomb
paraules_clau: [sal comuna, clorur de sodi, enllaç iònic, ions, energia potencial elèctrica, treball, camp elèctric uniforme]
tipus: [càlcul, qualitativa]
dificultat: 3
justificacio_dificultat: >-
  L'apartat a és directe; el b combina el treball contra l'atracció mútua amb el treball
  contra un camp extern i és ambigu (la pauta accepta dos sentits del camp).
