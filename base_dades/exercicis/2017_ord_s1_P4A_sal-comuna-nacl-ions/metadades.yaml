notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació dels apartats;
  s'ha pres la de la pauta (1 + 1). Errates de la pauta transcrites tal com són (amb
  % DUBTE): a l'apartat b s'escriu «9,76·19^-19» en lloc de 9,76·10^-19 als dos
  treballs totals, i en el cas (*) el producte qEd de valors positius dona «-1,6·10^-19
  J». També «8.16» i «0.236nm» amb punt decimal, passats a coma. Es respecta «força de
  atracció» i «(*) ó (**)» de l'original.
