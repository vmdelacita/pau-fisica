titol: Fobos i Deimos, els satèl·lits de Mart
resum: >-
  A partir del radi orbital i el període de Fobos, càlcul de la massa de Mart i de la
  intensitat del camp gravitatori a la seva superfície; període de revolució de Deimos
  (tercera llei de Kepler) i la seva energia mecànica.
