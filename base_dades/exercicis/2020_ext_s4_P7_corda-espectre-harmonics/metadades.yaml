id: 2020_ext_s4_P7_corda-espectre-harmonics
titol: Espectre d'una corda vibrant i ones estacionàries
resum: >-
  A partir de l'espectre de freqüències del so d'una corda de 40 cm fixada pels dos
  extrems, representació de les ones estacionàries dels quatre primers pics amb nodes i
  ventres, longituds d'ona i velocitat de propagació; freqüències i longituds d'ona quan
  la corda es redueix a 20 cm.
font:
  tipus: examen
  any: 2020
  convocatoria: extraordinaria
  serie: 4
  exercici: 7
  opcio: null
  pdf_enunciat: examenes/pau_fisi20sl.pdf
  pagines_enunciat: [4]
  pdf_solucio: examenes/pau_fisi20sp.pdf
  pagines_solucio: [6]
format: antic
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - ones estacionàries
  - ressonància i harmònics en tubs i cordes
paraules_clau: [corda vibrant, espectre de freqüències, harmònics, nodes, ventres, longitud d'ona, velocitat de propagació, freqüència fonamental]
tipus: [gràfic, diagrama, càlcul]
dificultat: 3
justificacio_dificultat: >-
  Cal llegir les freqüències al gràfic de l'espectre, identificar-les com a harmònics
  d'una corda fixada pels dos extrems i dibuixar-ne els modes; els càlculs són directes.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
