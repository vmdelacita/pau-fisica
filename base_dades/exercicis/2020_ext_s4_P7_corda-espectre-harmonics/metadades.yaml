    descripcio: Espectre del so de la corda (amplitud en funció de la freqüència) amb els pics A, B, C i D
  - fitxer: sol_fig1.png
    on: solucio
    descripcio: Ones estacionàries dels harmònics A, B, C i D amb els nodes (N) i els ventres (V)
solucio_oficial: true
revisat: false
notes: >-
  PDF escanejat, transcrit visualment. A l'apartat b la pauta parla de «la longitud de la
  cavitat» tot i que l'enunciat tracta d'una corda; s'ha transcrit tal com és (DUBTE).
  L'espectre també mostra un cinquè pic sense etiqueta a 600 Hz.
