id: 2025_mostra_optica_P3_mirall-pla-alcada
titol: Alçada mínima d'un mirall pla per veure's sencer
resum: >-
  Alçada mínima i posició d'un mirall pla perquè una persona s'hi vegi sencera; alçada
  màxima d'una segona persona situada darrere perquè sigui vista sencera i distància a
  la seva imatge.
font:
  tipus: mostra
  any: 2025
  convocatoria: mostra
  serie: optica
  exercici: 3
  opcio: null
  pdf_enunciat: documents oficials/02_pau25_fisica_MostraExercicis_optica.pdf
  pagines_enunciat: [1, 2]
  pdf_solucio: documents oficials/02_pau25_fisica_MostraExercicis_optica.pdf
  pagines_solucio: [5]
format: nou
curriculum: actual
bloc: Vibracions i ones
blocs_secundaris: []
subtemes:
  - reflexió i refracció
  - formació d'imatges amb lents i miralls
paraules_clau: [mirall pla, llei de la reflexió, alçada mínima del mirall, imatge virtual, geometria de rajos, triangles semblants]
tipus: [càlcul, diagrama, qualitativa]
dificultat: 4
justificacio_dificultat: >-
  Problema geomètric poc habitual: cal construir el diagrama de rajos amb la llei de la
  reflexió i raonar amb triangles semblants, especialment a l'apartat b.
punts_total: 2.5
apartats:
  - etiqueta: "a"
    punts: 1.25
    resum: Alçada mínima del mirall i altura de la seva vora inferior perquè la Meritxell es vegi sencera.
  - etiqueta: "b"
    punts: 1.25
    resum: Alçada màxima del Guifré, situat al doble de distància, per ser vist sencer i distància a la seva imatge.
figures:
  - fitxer: sol_fig1.png
    on: solucio
    descripcio: Esquema de la Meritxell davant del mirall amb els rajos des dels peus i el cap fins als ulls (cotes de 5 cm i 75 cm)
  - fitxer: sol_fig2.png
    on: solucio
    descripcio: Esquema amb el Guifré darrere la Meritxell, el mirall i les imatges, amb el raig límit i la cota de 10 cm
solucio_oficial: true
revisat: false
notes: >-
  L'enunciat no indica els punts per apartat; s'han repartit a parts iguals (1,25 + 1,25),
  que coincideix amb la suma de les puntuacions parcials de la resolució. L'enunciat original
  inclou la solució curta "Solució: 0.8m, 75cm, 1.65m, 3 vegades la distància". La resolució
  detallada no respon la segona pregunta de l'apartat b (distància a la imatge del Guifré);
  només la dona la solució curta ("3 vegades la distància"). A la fórmula de
  h_reflexió cap el numerador de la fracció surt mal compost al PDF (només s'hi llegeix
  "ulls"); s'ha reconstruït com (h_cap - h_ulls)/2, coherent amb el valor 0,10/2.
