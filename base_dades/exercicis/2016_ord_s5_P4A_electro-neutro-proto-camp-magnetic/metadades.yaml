notes: >-
  PDF escanejat: transcripció visual. L'enunciat no indica la puntuació de cada apartat; s'ha posat 1 punt a cada apartat, que coincideix amb la suma de les puntuacions parcials de la pauta. A la pauta les puntuacions parcials apareixen en caixes darrere del pas que puntuen, i així s'han transcrit. A la pauta de l'apartat a el resultat de la força s'escriu amb el
  signe ≡ en lloc de =, i a l'apartat b la unitat del camp del fil s'escriu en cursiva
  (T k̂); s'ha transcrit tal com és. Els punts decimals de la pauta s'han passat a coma.
