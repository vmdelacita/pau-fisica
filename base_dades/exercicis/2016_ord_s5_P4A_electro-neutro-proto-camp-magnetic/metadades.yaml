  pagines_enunciat: [6]
  pdf_solucio: examenes/pau_fisi16jp.pdf
  pagines_solucio: [10]
format: antic
curriculum: actual
bloc: Camps electromagnètics
blocs_secundaris: []
subtemes:
  - moviment de càrregues en camps magnètics
  - camp magnètic creat per corrents
paraules_clau: [força de Lorentz, electró, neutró, protó, moviment circular, sentit de gir, fil infinit, anul·lació del camp magnètic]
tipus: [càlcul, qualitativa]
dificultat: 3
justificacio_dificultat: >-
  Cal aplicar la força de Lorentz amb vectors i raonar el sentit de gir de cada partícula,
  i després imposar que el camp del fil anul·li el camp uniforme a la posició del protó.
punts_total: 2
