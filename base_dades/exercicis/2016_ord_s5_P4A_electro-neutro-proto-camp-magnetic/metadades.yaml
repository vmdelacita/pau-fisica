id: 2016_ord_s5_P4A_electro-neutro-proto-camp-magnetic
titol: Electró, neutró i protó en un camp magnètic i fil infinit
resum: >-
  Força i tipus de moviment d'un electró, un neutró i un protó que entren amb la mateixa
  velocitat en un camp magnètic uniforme; corrent d'un fil infinit paral·lel a l'eix Y que
  anul·la el camp sobre el protó perquè segueixi una trajectòria rectilínia.
font:
  tipus: examen
  any: 2016
  convocatoria: ordinaria
  serie: 5
  exercici: 4
