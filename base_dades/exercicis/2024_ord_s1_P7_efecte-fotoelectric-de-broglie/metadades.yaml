id: 2024_ord_s1_P7_efecte-fotoelectric-de-broglie
titol: Efecte fotoelèctric en un metall amb llindar de 650 nm
resum: >-
  Treball d'extracció d'un metall a partir de la longitud d'ona llindar i potencial de
  frenada per a llum de 300 nm. Expressió de la velocitat dels fotoelectrons en funció
  de la longitud d'ona, velocitat per a 500 nm i longitud d'ona de De Broglie associada.
