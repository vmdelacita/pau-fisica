  - fitxer: sol_fig1.png
    on: solucio
    descripcio: Parallamps amb el sentit dels electrons i del corrent, línies de camp concèntriques i regla de la mà dreta
  - fitxer: sol_fig2.png
    on: solucio
    descripcio: Gràfica del mòdul del camp magnètic B (T) en funció de r (m) entre 0,1 i 0,5 m
  - fitxer: sol_fig3.png
    on: solucio
    descripcio: Força magnètica sobre l'electró dirigida cap al parallamps
