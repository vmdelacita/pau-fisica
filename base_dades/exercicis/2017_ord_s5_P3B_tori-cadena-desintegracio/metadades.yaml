id: 2017_ord_s5_P3B_tori-cadena-desintegracio
titol: Cadena de desintegració del tori-232
resum: >-
  Escriure les reaccions nuclears (desintegracions alfa i beta) de la cadena del tori-232
  fins al plom-208 a partir de la llista d'isòtops intermedis; percentatge de tori-232 que
  queda sense desintegrar al cap de 2,0·10^10 anys.
