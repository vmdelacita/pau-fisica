  - ressonància i harmònics en tubs i cordes
paraules_clau: [trompeta, instrument de vent, tub tancat per un extrem, harmònics, modes de vibració, pistó, longitud efectiva, velocitat del so]
tipus: [càlcul, deducció]
dificultat: 3
justificacio_dificultat: >-
  Cal establir la condició d'ones estacionàries en un tub obert per un extrem i
  identificar correctament el segon mode (harmònic 3) per calcular la nova longitud.
