notes: >-
  PDF escanejat: transcripció visual. L'enunciat no dona la puntuació de cada apartat;
  segons la pauta cada apartat val 1 punt. A la pauta hi ha «87.2 Hz» amb punt decimal
  (passat a coma) i algunes errates d'accents («estacionaries», «es a dir») transcrites
  tal com són. A l'original els tres grups n = 0, 1, 2 són en una sola línia; aquí es
  parteixen en dues línies perquè hi càpiguen.
