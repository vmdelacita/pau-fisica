id: 2014_ord_s3_P5A_trompeta-ones-estacionaries
titol: Ones estacionàries en una trompeta
resum: >-
  Longitud d'ona i freqüència dels tres primers modes estacionaris en un tub tancat per un
  extrem que modelitza una trompeta; longitud efectiva de la cavitat quan es prem un pistó
  i recorregut extra de l'aire.
