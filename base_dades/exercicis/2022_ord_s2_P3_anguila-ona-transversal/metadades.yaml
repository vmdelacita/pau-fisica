id: 2022_ord_s2_P3_anguila-ona-transversal
titol: Ona transversal en el moviment d'una anguila
resum: >-
  A partir de la freqüència, l'amplitud i la longitud d'ona del moviment ondulatori d'una
  anguila, càlcul de la velocitat de propagació, la freqüència angular i el nombre d'ona,
  i deducció de l'equació d'ona; càlcul de la velocitat i l'acceleració transversals
  màximes i en un punt i instant concrets.
