dificultat: 3
justificacio_dificultat: >-
  Cal combinar la longitud d'ona i la freqüència per obtenir v, omega i k, deduir
  l'equació d'ona a partir de les condicions inicials d'elongació i velocitat (fase
  inicial), i derivar-la per obtenir velocitat i acceleració transversals; diversos
  passos encadenats típics d'un problema PAU.
