id: 2016_ord_s3_P2_molles-mhs-frequencia-doble
titol: Dues molles idèntiques oscil·lant amb freqüències diferents
resum: >-
  Massa que cal penjar d'una molla idèntica perquè oscil·li amb freqüència doble;
  gràfica velocitat-temps de les dues oscil·lacions durant 2 s i instants en què la
  diferència de fase és de pi radians.
