id: 2019_ord_s4_P4B_descarrega-arc-tres-electrons
titol: Descàrrega en arc i energia de tres electrons
resum: >-
  Diferència de potencial mínima per a una descàrrega en arc entre la mà i el pom d'una
  porta a partir del camp de ruptura dielèctrica de l'aire, i treball necessari per
  portar tres electrons des de l'infinit fins als vèrtexs d'un triangle equilàter.
