id: 2013_ord_s3_P2_cambra-acceleradora-electrons
titol: Cambra acceleradora d'electrons
resum: >-
  Camp elèctric dins d'una cambra de 30,0 cm on els electrons tenen una acceleració d'1,20·10^13 m/s^2; diferència de potencial entre les parets, paret de potencial més alt i energia que guanya cada electró.
