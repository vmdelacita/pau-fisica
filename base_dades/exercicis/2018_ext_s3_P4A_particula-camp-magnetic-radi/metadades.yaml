id: 2018_ext_s3_P4A_particula-camp-magnetic-radi
titol: Partícula carregada en un camp magnètic uniforme
resum: >-
  Dibuix de la força magnètica inicial i velocitat d'una partícula negativa que descriu
  una circumferència de 0,30 m en un camp magnètic de 0,50 T; període, velocitat angular
  i energia cinètica a l'entrada i després d'una volta.
