id: 2013_ord_s4_P3B_quadrat-dues-carregues
titol: Camp i treball amb dues càrregues en els vèrtexs d'un quadrat
resum: >-
  Camp elèctric al centre d'un quadrat de 2,00 m de costat amb càrregues de +9,00 µC i
  −9,00 µC als vèrtexs de l'esquerra; treball de la força elèctrica sobre una càrrega de
  7,00 µC traslladada del centre al vèrtex inferior dret.
