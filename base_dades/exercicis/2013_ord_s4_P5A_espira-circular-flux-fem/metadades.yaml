id: 2013_ord_s4_P5A_espira-circular-flux-fem
titol: Flux i FEM induïda en una espira circular amb camp decreixent
resum: >-
  Flux magnètic a través d'una espira circular de 4,0 cm de radi en un camp de 0,50 T que
  forma 60° amb la normal i justificació que no s'indueix FEM si el camp és constant; FEM
  induïda quan el camp disminueix linealment fins a zero en 100 ms (gràfica B-t).
