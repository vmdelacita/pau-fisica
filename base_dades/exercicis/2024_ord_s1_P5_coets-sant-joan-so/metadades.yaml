id: 2024_ord_s1_P5_coets-sant-joan-so
titol: Nivell d'intensitat sonora dels coets de Sant Joan
resum: >-
  A partir del nivell d'intensitat sonora mesurat a 50 m, potència i energia sonora
  de l'explosió d'un coet. Altura d'explosió d'un coet enlairat a partir del nou
  nivell sonor i nivell d'intensitat de dos coets simultanis.
