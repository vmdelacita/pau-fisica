paraules_clau: [coets, revetlla de Sant Joan, sonòmetre, decibels, potència sonora, intensitat sonora, ones esfèriques, teorema de Pitàgores]
tipus: [càlcul]
dificultat: 3
justificacio_dificultat: >-
  Càlculs estàndard de nivell d'intensitat i potència amb ones esfèriques; cal
  combinar-los amb la geometria (Pitàgores) per trobar l'altura i raonar la suma
  d'intensitats de dues fonts.
