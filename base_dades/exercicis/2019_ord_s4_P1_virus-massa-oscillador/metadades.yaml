revisat: false
notes: >-
  A l'apartat a de la pauta falta el quadrat a (4π × 10^15) en el càlcul de k; el
  resultat (3,32 × 10^13 N/m) sí que correspon al quadrat. S'ha transcrit tal com és
  amb un comentari DUBTE.
