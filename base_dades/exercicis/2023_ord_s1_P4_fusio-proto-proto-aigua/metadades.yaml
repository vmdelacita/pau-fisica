id: 2023_ord_s1_P4_fusio-proto-proto-aigua
titol: Fusió nuclear i l'energia d'un got d'aigua
resum: >-
  Energia alliberada en la cadena protó-protó per defecte de massa i energia extraïble de
  l'hidrogen d'un got d'aigua; reacció de producció de triti a partir de liti 6 i neutrons,
  i discussió de si la fusió és una font d'energia neta i inesgotable.
