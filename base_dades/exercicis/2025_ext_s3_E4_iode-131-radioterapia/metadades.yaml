id: 2025_ext_s3_E4_iode-131-radioterapia
titol: Iode 131 en radioteràpia de la tiroide
resum: >-
  Reacció de desintegració beta menys del iode 131 a xenó 131 amb l'antineutrí; massa de
  I-131 d'una pastilla a partir de l'activitat, activitat al cap d'una setmana i
  representació gràfica de l'activitat en funció del temps.
