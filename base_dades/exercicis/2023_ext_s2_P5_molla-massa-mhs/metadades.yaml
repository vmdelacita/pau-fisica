id: 2023_ext_s2_P5_molla-massa-mhs
titol: Determinació d'una massa amb una molla oscil·lant i equació del MHS
resum: >-
  Raonar com determinar una massa a partir del període d'oscil·lació d'una molla de constant
  coneguda i si el resultat seria igual a la Lluna; deduir l'equació del MHS amb condicions
  inicials (acceleració màxima positiva) i calcular la velocitat i l'acceleració màximes.
