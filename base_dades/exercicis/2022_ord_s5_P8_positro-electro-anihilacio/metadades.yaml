id: 2022_ord_s5_P8_positro-electro-anihilacio
titol: Materialització d'un fotó en un parell electró-positró i anihilació
resum: >-
  Càlcul de l'energia mínima, la freqüència, la longitud d'ona i la quantitat de moviment
  d'un fotó que es materialitza en un parell electró-positró, i preguntes conceptuals
  sobre les desintegracions beta i la conservació de la càrrega i el moment en
  l'anihilació positró-electró.
