id: 2025_model_s0_E1A_bepicolombo-mercuri-orbita
titol: Satèl·lit MPO de la missió BepiColombo en òrbita al voltant de Mercuri
resum: >-
  Deducció de la velocitat orbital d'un satèl·lit en òrbita circular i càlcul per al
  satèl·lit MPO al voltant de Mercuri; nombre de voltes en un any terrestre. Expressió
  de l'energia mecànica orbital i massa màxima del satèl·lit perquè pugui escapar del
  camp gravitatori de Mercuri amb l'energia del combustible.
