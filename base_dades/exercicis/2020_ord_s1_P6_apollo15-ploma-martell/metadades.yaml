id: 2020_ord_s1_P6_apollo15-ploma-martell
titol: L'experiment de la ploma i el martell de l'Apollo 15
resum: >-
  A partir del temps de caiguda lliure d'una ploma i un martell a la Lluna (experiment de
  David Scott), càlcul de la intensitat del camp gravitatori lunar i de la massa de la
  Lluna; període orbital de la Lluna al voltant de la Terra.
