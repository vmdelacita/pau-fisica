id: 2017_ord_s1_P3B_agulla-maquina-cosir-mhs
titol: Agulla d'una màquina de cosir en MHS
resum: >-
  Equació del moviment harmònic simple d'una agulla que oscil·la 15 mm d'extrem a extrem
  a 1 200 puntades per minut, partint de la posició més alta, i gràfica posició-temps de
  dos períodes; velocitat i acceleració màximes.
